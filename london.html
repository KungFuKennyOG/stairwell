<meta charset="utf-8">
<title>Bethnal Green Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a full-bleed 3D view. A case-file label top-left, look switches top-right, the cast file bottom-left.
   London VR's own kit: Anton for names (the freeze-frame type), Courier Prime for everything else, like a typed
   police file. Wet black, sodium amber, chicken-shop red; nothing borrowed from Stairwell. */
:root{
  --ink:#ece6da; --ink2:#bdb6a8; --muted:#8c857a; --bg:#090a0b; --paper:rgba(14,15,15,.88); --rule:#33302b;
  --amber:#f0a23e; --red:#c8261c; --met:#3a5ab8;
  --name:'Anton','Impact','Arial Narrow',sans-serif;
  --type:'Courier Prime','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--type);overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#view:active{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto;box-sizing:border-box}
.label{grid-column:1;grid-row:1;align-self:start;justify-self:start;display:grid;gap:2px;min-width:0}
.label .file{margin:0;font:700 12px/1.2 var(--type);color:var(--amber);letter-spacing:.04em}
.label h1{margin:0;font:400 clamp(34px,5.6vw,60px)/.92 var(--name);letter-spacing:.005em;text-transform:uppercase;text-shadow:3px 3px 0 #000}
.label .links{display:flex;gap:14px;margin-top:6px;font-size:12.5px}
.label a{color:var(--ink2);text-underline-offset:3px}
.look{grid-column:2;grid-row:1;align-self:start;background:var(--paper);border-left:3px solid var(--amber);padding:10px 14px;display:grid;gap:7px;font-size:13px}
.look label{display:flex;gap:9px;align-items:center;cursor:pointer}
.look input{accent-color:var(--amber);width:15px;height:15px;margin:0}
#clock{grid-column:2;grid-row:2;align-self:start;justify-self:end;text-align:right;color:var(--ink2);font-size:12.5px;text-shadow:0 0 8px #000}
#clock b{display:block;font:400 40px/1 var(--name);color:var(--ink);letter-spacing:.02em}
.card{grid-column:1;grid-row:3;align-self:end;justify-self:start;width:min(460px,100%);max-height:54vh;overflow:auto;background:var(--paper);border-left:3px solid var(--amber);padding:14px 16px 10px;display:grid;gap:10px}
.card .sub{margin:0;font-weight:700;font-size:12px;color:var(--amber)}
.card h2{margin:0;font:400 30px/1 var(--name);text-transform:uppercase;letter-spacing:.01em}
.card .body{margin:0;color:var(--ink2);font-size:13.5px;max-width:60ch}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.btn,.seg button{font:700 13px/1 var(--type);color:var(--ink);background:none;border:1px solid var(--rule);padding:9px 11px;cursor:pointer;min-height:36px}
.btn:hover,.seg button:hover{border-color:var(--amber)}
.btn[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#160f06}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{margin-right:-1px}
.seg-label{margin:0 0 5px;font-size:12px;color:var(--muted)}
.card ul.list{list-style:none;margin:0;padding:0;display:grid}
.list li button{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px dashed var(--rule);color:var(--ink);font:inherit;padding:8px 2px;cursor:pointer}
.list li .dot{width:10px;height:10px;align-self:center}
.list li b{font-weight:700}
.list li .who{color:var(--muted);font-size:12.5px;margin-left:6px}
.list li small{display:none;color:var(--ink2);font-size:12.5px;line-height:1.5;margin-top:3px}
.list li button[aria-pressed="true"] b{color:var(--amber)}
.list li button[aria-pressed="true"] small{display:block}
.tag{font-size:11px;font-weight:700;padding:1px 5px;margin-right:6px;border:1px solid var(--rule);color:var(--ink2)}
.tag.you{background:var(--amber);border-color:var(--amber);color:#160f06}
.tag.crew{border-color:var(--red);color:#f0928a}
.tag.law{border-color:var(--met);color:#a8baf0}
.note{margin:0;padding:8px 10px;border-left:2px solid var(--red);background:rgba(200,38,28,.07);font-size:13px;color:var(--ink2)}
.note b{color:var(--ink)}
.hint{grid-column:2;grid-row:3;align-self:end;justify-self:end;margin:0;font-size:12px;color:var(--muted);text-align:right;text-shadow:0 0 6px #000}
a:focus-visible,button:focus-visible,#view:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#err{position:fixed;inset:auto 16px 16px;padding:12px 14px;background:var(--paper);border-left:3px solid var(--red);font-size:13px}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink2);background:var(--bg)}
body.capture .hud,body.capture #loading{display:none!important}
body.frozen .card,body.frozen .label,body.frozen #clock,body.frozen .hint{opacity:.12;transition:opacity .25s}
@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .look{grid-column:1;grid-row:2;justify-self:start;grid-auto-flow:column}
  #clock{grid-column:1;grid-row:3}
  .card{grid-row:4;max-height:44vh;width:100%}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<canvas id="view" tabindex="0" aria-label="3D view of Bethnal Green Road at night with the cast. Drag to look around, scroll or pinch to zoom."></canvas>
<div class="hud">

<script>
'use strict';
(function(){
const cv=document.getElementById('view');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
const errBox=document.getElementById('err');
function fail(msg){ errBox.textContent=msg; errBox.hidden=false; }
if(!gl){ fail('This page needs WebGL2, which this browser has turned off. Try the Quest browser, or Chrome, Firefox or Safari.'); return; }

/* ================= math ================= */
const m4={
  make(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
  mul(o,a,b){ for(let c=0;c<4;c++){ const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3; o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3; o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3; } return o; },
  persp(o,fovy,aspect,near,far){ const f=1/Math.tan(fovy/2); o.fill(0); o[0]=f/aspect; o[5]=f; o[10]=(far+near)/(near-far); o[11]=-1; o[14]=2*far*near/(near-far); return o; },
  lookAt(o,e,c,up){
    let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2]; let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx; l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0; o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0; o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]); o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]); o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1; return o; },
  compose(o,p,r,s){
    const a=Math.cos(r[0]),b=Math.sin(r[0]),c=Math.cos(r[1]),d=Math.sin(r[1]),e=Math.cos(r[2]),f=Math.sin(r[2]);
    const ae=a*e,af=a*f,be=b*e,bf=b*f;
    o[0]=c*e*s[0]; o[1]=(af+be*d)*s[0]; o[2]=(bf-ae*d)*s[0]; o[3]=0;
    o[4]=-c*f*s[1]; o[5]=(ae-bf*d)*s[1]; o[6]=(be+af*d)*s[1]; o[7]=0;
    o[8]=d*s[2]; o[9]=-b*c*s[2]; o[10]=a*c*s[2]; o[11]=0;
    o[12]=p[0]; o[13]=p[1]; o[14]=p[2]; o[15]=1; return o; }
};
const norm3=v=>{ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const rng=seed=>()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

/* ================= scene graph ================= */
class Node{ constructor(){ this.p=[0,0,0]; this.r=[0,0,0]; this.s=[1,1,1]; this.kids=[]; this.vis=true; this.local=m4.make(); this.world=m4.make(); this.mesh=null; this.par=null; }
  add(n){ this.kids.push(n); n.par=this; return n; } }
function N(parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=new Node(); n.p=[x,y,z]; n.r=[rx,ry,rz]; if(parent) parent.add(n); return n; }
function mk(geo,mats,parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=N(parent,x,y,z,rx,ry,rz); n.mesh={geo,mats:Array.isArray(mats)?mats:[mats],runs:null}; return n; }
function setParent(n,p){ if(n.par===p) return; if(n.par){ const i=n.par.kids.indexOf(n); if(i>=0) n.par.kids.splice(i,1); } p.add(n); }
function updateWorld(n,pw){ if(!n.vis) return; m4.compose(n.local,n.p,n.r,n.s); if(pw) m4.mul(n.world,pw,n.local); else n.world.set(n.local); for(const k of n.kids) updateWorld(k,n.world); }

/* ================= geometry ================= */
let GEO_TEMP=false;
class Geo{ constructor(){ this.P=[]; this.Nm=[]; this.T=[]; this.I=[]; this.groups=[]; this.vao=null; this.bufs=null; this.temp=GEO_TEMP; }
  v(p,n,t){ this.P.push(p[0],p[1],p[2]); this.Nm.push(n[0],n[1],n[2]); this.T.push(t[0],t[1]); return this.P.length/3-1; } }
function shift(g,x,y,z){ for(let i=0;i<g.P.length;i+=3){ g.P[i]+=x; g.P[i+1]+=y; g.P[i+2]+=z; } return g; }
function flatNormals(g){ for(let i=0;i<g.I.length;i+=3){ const a=g.I[i]*3,b=g.I[i+1]*3,c=g.I[i+2]*3,P=g.P;
  const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2];
  const n=norm3([uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx]); for(const k of [a,b,c]){ g.Nm[k]=n[0]; g.Nm[k+1]=n[1]; g.Nm[k+2]=n[2]; } } return g; }
const FACES=[[[1,0,0],[0,0,-1],[0,1,0],'d','h','w'],[[-1,0,0],[0,0,1],[0,1,0],'d','h','w'],[[0,1,0],[1,0,0],[0,0,-1],'w','d','h'],[[0,-1,0],[1,0,0],[0,0,1],'w','d','h'],[[0,0,1],[1,0,0],[0,1,0],'w','h','d'],[[0,0,-1],[-1,0,0],[0,1,0],'w','h','d']];
function box(w,h,d,o={}){
  const g=new Geo(),S={w,h,d};
  FACES.forEach(([n,U,V,ku,kv,ko],fi)=>{ const start=g.I.length,base=g.P.length/3,du=S[ku]/2,dv=S[kv]/2,off=S[ko]/2;
    for(const [a,b] of [[-1,-1],[1,-1],[1,1],[-1,1]]) g.v([0,1,2].map(k=>n[k]*off+U[k]*a*du+V[k]*b*dv),n,[(a+1)/2,(b+1)/2]);
    g.I.push(base,base+1,base+2,base,base+2,base+3); g.groups.push({start,count:6,mi:fi}); });
  if(o.tw!==undefined||o.td!==undefined){ const tw=o.tw??1,td=o.td??1; for(let i=0;i<g.P.length;i+=3) if(g.P[i+1]>0){ g.P[i]*=tw; g.P[i+2]*=td; } flatNormals(g); }
  if(o.pivot==='t') shift(g,0,-h/2,0); else if(o.pivot==='b') shift(g,0,h/2,0);
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]);
  return g;
}
function plane(w,h,sx=1,sy=1){ const g=new Geo();
  for(let j=0;j<=sy;j++) for(let i=0;i<=sx;i++) g.v([(i/sx-.5)*w,(j/sy-.5)*h,0],[0,0,1],[i/sx,j/sy]);
  for(let j=0;j<sy;j++) for(let i=0;i<sx;i++){ const a=j*(sx+1)+i,b=a+1,c=a+sx+2,d=a+sx+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
function cyl(rt,rb,h,seg,o={}){ const g=new Geo(),hh=h/2,slope=(rb-rt)/h;
  for(let j=0;j<=1;j++){ const y=j?hh:-hh,r=j?rt:rb; for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2,sx=Math.sin(a),cz=Math.cos(a); g.v([r*sx,y,r*cz],norm3([sx,slope,cz]),[i/seg,j]); } }
  for(let i=0;i<seg;i++){ const a=i,b=i+1,c=i+seg+2,d=i+seg+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0});
  if(!o.open){ for(const top of [1,0]){ const start=g.I.length,y=top?hh:-hh,r=top?rt:rb,ny=top?1:-1; const c=g.v([0,y,0],[0,ny,0],[.5,.5]);
    for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; g.v([r*Math.sin(a),y,r*Math.cos(a)],[0,ny,0],[.5+Math.sin(a)/2,.5+Math.cos(a)/2]); }
    for(let i=0;i<seg;i++){ if(top) g.I.push(c,c+1+i,c+2+i); else g.I.push(c,c+2+i,c+1+i); }
    g.groups.push({start,count:g.I.length-start,mi:top?1:2}); } }
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]); return g; }
function torus(R,r,rs,ts){ const g=new Geo();
  for(let j=0;j<=rs;j++) for(let i=0;i<=ts;i++){ const u=i/ts*Math.PI*2,v=j/rs*Math.PI*2,cx=R*Math.cos(u),cy=R*Math.sin(u);
    const p=[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)]; g.v(p,norm3([p[0]-cx,p[1]-cy,p[2]]),[i/ts,j/rs]); }
  for(let j=1;j<=rs;j++) for(let i=1;i<=ts;i++){ const a=(ts+1)*j+i-1,b=(ts+1)*(j-1)+i-1,c=(ts+1)*(j-1)+i,d=(ts+1)*j+i; g.I.push(a,b,d,b,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
/* merge axis-aligned boxes into one single-material geometry (one draw call) */
function mergeBoxes(list){ const g=new Geo();
  for(const it of list){ const b=box(it[3],it[4],it[5]); const base=g.P.length/3;
    for(let i=0;i<b.P.length;i+=3) g.P.push(b.P[i]+it[0],b.P[i+1]+it[1],b.P[i+2]+it[2]);
    for(const v of b.Nm) g.Nm.push(v);
    for(let i=0;i<b.T.length;i+=2){ g.T.push(b.T[i]*(it[6]||1),b.T[i+1]*(it[7]||1)); }
    for(const ix of b.I) g.I.push(ix+base); }
  g.groups=[{start:0,count:g.I.length,mi:0}]; return g; }

/* ================= textures ================= */
function tex(w,h,base,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); if(base){ g.fillStyle=base; g.fillRect(0,0,w,h); } if(fn) fn(g,w,h); return {c,glt:null,f:-1}; }
function R(g,col,x,y,w,h){ g.fillStyle=col; g.fillRect(x,y,w,h); }
function grain(g,amt,seed=1){ const w=g.canvas.width,h=g.canvas.height,d=g.getImageData(0,0,w,h),r=rng(seed); for(let i=0;i<d.data.length;i+=4){ if(!d.data[i+3]) continue; const n=(r()-.5)*amt; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n; } g.putImageData(d,0,0); }
function specks(g,col,n,seed,w,h,x0=0,y0=0){ const r=rng(seed); for(let i=0;i<n;i++) R(g,col,x0+(r()*w|0),y0+(r()*h|0),1,1); }
function grid(g,rows,pal){ rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const col=pal[row[x]]; if(col) R(g,col,x,y,1,1); } }); }
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','-':'000000111000000',':':'000010000010000','#':'101111101111101','!':'010010010000010','.':'000000000000010','/':'001001010100100','+':'000010111010000','>':'100010001010100','^':'010101000000000'};
function text(g,str,x,y,col,s=1){ g.fillStyle=col; let cx=x; for(const ch of str.toUpperCase()){ const gl_=FONT[ch]; if(gl_) for(let i=0;i<15;i++) if(gl_[i]==='1') g.fillRect(cx+(i%3)*s,y+Math.floor(i/3)*s,s,s); cx+=4*s; } }
const textW=(str,s=1)=>str.length*4*s-s;
function cl(w,h,base,amt,seed,fn){ return tex(w,h,base,g=>{ if(fn) fn(g,w,h); grain(g,amt,seed); }); }

/* --- shared environment --- */

const VS=`#version 300 es
precision highp float;
in vec3 position; in vec3 normal; in vec2 uv;
uniform mat4 modelMatrix, viewMatrix, projectionMatrix;
uniform float uSnap, uAffine, uUnlit;
uniform vec2 uRes;
uniform vec3 uAmb, uDirDir, uDirCol;
uniform vec3 uPLPos[8]; uniform vec3 uPLCol[8]; uniform float uPLDist[8];
uniform float uFogNear, uFogFar;
in vec4 aRect; /* an atlas rectangle for a tiled texture (z>0), or, on the far field, the centre and radius of the tile it stands in for */
uniform float uFar, uFarSwap; uniform vec3 uFarEye;
out vec3 vAff; out vec3 vLight; out vec3 vView; out vec4 vRect;
void main(){
  vec4 wp = modelMatrix * vec4(position,1.0);
  vec3 n = normalize(mat3(modelMatrix) * normal);
  vec3 L = uAmb + uDirCol * max(dot(n, normalize(uDirDir)), 0.0);
  if(uUnlit < 0.5) for(int i=0;i<8;i++){
    vec3 d = uPLPos[i] - wp.xyz; float dist = length(d);
    float a = clamp(1.0 - dist / uPLDist[i], 0.0, 1.0); a *= a;
    L += uPLCol[i] * a * max(dot(n, d / max(dist, 1e-4)), 0.0);
  }
  vLight = mix(L, vec3(1.0), uUnlit);
  vec4 vp = viewMatrix * wp;
  vec4 cp = projectionMatrix * vp;
  if(uSnap > 0.01){ vec2 g = uRes * 0.5 * uSnap; cp.xy = floor(cp.xy / cp.w * g + 0.5) / g * cp.w; } /* uSnap scales the grid: 1 = PS1, higher = finer, lighter */
  vView = vp.xyz; /* fog goes by true distance (per pixel), the same distance the culling uses, so nothing pops at the edges of a wide headset view */
  float aw = mix(1.0, cp.w, clamp(uAffine, 0.0, 1.0)); vAff = vec3(uv * aw, aw); /* uAffine 0..1: how much of the PS1 texture warp */
  gl_Position = cp;
  vRect = uFar > 0.5 ? vec4(0.0) : aRect;
  /* the far field: a stand-in only shows while the real tile it stands in for is too far to be drawn (the same test the CPU uses) */
  if(uFar > 0.5 && length(uFarEye - aRect.xyz) - aRect.w <= uFarSwap) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);

const FS=`#version 300 es
precision highp float;
uniform sampler2D map; uniform float uHasMap, uCut;
uniform vec3 uColor, uEmissive, uFogCol; uniform vec2 uRepeat; uniform float uNoFog, uFogNear, uFogFar, uSkyFade;
in vec3 vAff; in vec3 vLight; in vec3 vView; in vec4 vRect;
out vec4 outColor;
void main(){
  vec2 uv = vAff.xy / vAff.z * uRepeat;
  if(vRect.z > 0.0) uv = vRect.xy + fract(uv) * vRect.zw; /* a tiled texture living in the atlas: wrap inside its own rectangle */
  vec4 t = uHasMap > 0.5 ? texture(map, uv) : vec4(1.0);
  if(uCut > 0.5 && t.a < 0.5) discard;
  vec3 c = t.rgb * uColor * vLight + t.rgb * uEmissive;
  float f = clamp((length(vView) - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0) * (1.0 - uNoFog); /* uNoFog: the sky and things in it (a backdrop past the fog) */
  /* uSkyFade: on a level with a sky, the last stretch of the fog dissolves into the sky already drawn behind (blended), instead of
     leaving a black cut-out that vanishes when it's culled */
  outColor = vec4(mix(c, uFogCol, f), 1.0 - uSkyFade * smoothstep(0.8, 1.0, f));

const PFS=`#version 300 es

uniform sampler2D tScene; uniform vec2 uRes; uniform float uDither;
in vec2 vUv; out vec4 outColor;
float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }

/* =====================================================================================================
   LONDON VR'S OWN LOOK, on top of the Stairwell renderer, without touching the shared engine.
   - No PS1 pass: no vertex snap, no affine warp, no 15-bit dither. Textures are mipmapped, linear and anisotropic.
   - A bleach-bypass grade in the material shader (no screen-space post, so it costs the same in the headset):
     mid-tones at ~58% saturation, an S-curve, a green-grey shadow floor, sodium-amber highlights, and only the
     signature colours (chicken-shop red, sodium amber, Met blue) keep full saturation.
   - Fine film grain per fragment, re-seeded every frame.
   - uFreeze 0..1: the freeze-frame. The world drains to ~15% saturation, red survives, contrast punches up.
   On desktop the scene renders supersampled and is box-filtered down (the engine's canvas has no MSAA); in the
   headset the XR layer's own antialiasing does that job.
   ===================================================================================================== */
const FS_LDN=`#version 300 es
precision highp float;
uniform sampler2D map; uniform float uHasMap, uCut;
uniform vec3 uColor, uEmissive, uFogCol; uniform vec2 uRepeat; uniform float uNoFog, uFogNear, uFogFar, uSkyFade;
uniform float uTime, uFreeze, uGrade, uGrain;
in vec3 vAff; in vec3 vLight; in vec3 vView; in vec4 vRect;
out vec4 outColor;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){

  if(vRect.z > 0.0) uv = vRect.xy + fract(uv) * vRect.zw;
  vec4 t = uHasMap > 0.5 ? texture(map, uv) : vec4(1.0);
  if(uCut > 0.5 && t.a < 0.5) discard;
  vec3 c = t.rgb * uColor * vLight + t.rgb * uEmissive;
  float f = clamp((length(vView) - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0) * (1.0 - min(uNoFog, 1.0));
  c = mix(c, uFogCol, f);
  if(uGrade > 0.5 && uNoFog < 1.5){   /* uNoFog = 2: titles and cards, which sit outside the grade */
    c = clamp(c, 0.0, 1.0);
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b)), s = (mx - mn) / (mx + 1e-4);
    float red = step(c.g * 1.7, c.r) * step(c.b * 1.7, c.r);
    float amber = step(c.b * 2.2, c.r) * step(c.r * 0.45, c.g) * step(c.g, c.r);
    float blue = step(c.r * 1.5, c.b) * step(c.g * 1.05, c.b);
    float sig = smoothstep(0.42, 0.62, s) * clamp(red + amber + blue, 0.0, 1.0);
    float skin = step(c.b, c.g) * step(c.g, c.r) * smoothstep(0.12, 0.22, s) * (1.0 - smoothstep(0.55, 0.75, s)) * smoothstep(0.08, 0.2, l);
    float sat = mix(mix(0.58, 0.86, skin), 1.0, sig);                 /* skin keeps its warmth: bleach bypass, not a corpse */
    sat = mix(sat, mix(0.14, 0.92, sig * red), uFreeze);                 /* the freeze keeps only the reds */
    c = mix(vec3(l), c, sat);
    c = mix(c, c * c * (3.0 - 2.0 * c), 0.42 + 0.25 * uFreeze);          /* S-curve, harder on a freeze */
    float sh = 1.0 - smoothstep(0.0, 0.32, l);
    c = c * vec3(0.95, 1.0, 0.97) * (1.0 - sh * 0.04) + vec3(0.014, 0.024, 0.02) * sh;   /* green-grey floor: inky, not crushed */
    float hi = smoothstep(0.5, 1.0, l);

  }

  outColor = vec4(c, 1.0 - uSkyFade * smoothstep(0.8, 1.0, f));
}`;

precision highp float;
uniform sampler2D tScene; uniform vec2 uRes; uniform float uSS;
in vec2 vUv; out vec4 outColor;
void main(){ vec2 px = gl_FragCoord.xy * uSS; vec3 c = vec3(0.0);

   eye level is a flat picture: shopfronts are recessed with frames, a stall riser, a counter and a back wall;
   signs and shutter boxes have thickness; textures at eye level run 60-80 px per metre. Rain is a volume of

   ===================================================================================================== */

function setEye(on){ state.eye=on; unfreeze(); if(on){ const e=eyePos(); setGoal({t:[Math.max(-14,Math.min(14,e[0])),PAVE_Y+1.65,Math.min(KERB_Z-.4,Math.max(FZ+.6,1.8))],th:cam.th+Math.PI,ph:Math.PI/2,r:.04}); if(state.layout==='street') setGoal({t:[1.2,PAVE_Y+1.65,2],th:-1.15+Math.PI*0+1.15+.9,ph:1.6,r:.04}); } else setGoal(state.layout==='lineup'?{t:[0,1.05,1.4],th:0,ph:1.42,r:innerWidth>760?7.4:9.6}:HOME); renderCard(); }
cv.addEventListener('keydown',e=>{ const k={ArrowLeft:[.12,0],ArrowRight:[-.12,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key];
  if(k){ e.preventDefault(); goal.th+=k[0]; goal.ph+=k[1]; clampGoal(); } if(e.key==='+'||e.key==='='){ goal.r*=.9; clampGoal(); } if(e.key==='-'){ goal.r*=1.1; clampGoal(); } if(e.key==='Escape') unfreeze(); });
function pan(dx,dy){ const s=goal.r*.0016; const rx=Math.cos(cam.th),rz=-Math.sin(cam.th); goal.t[0]-=rx*dx*s; goal.t[2]-=rz*dx*s; goal.t[1]+=dy*s; goal.t[1]=Math.max(.3,Math.min(8,goal.t[1])); goal.t[0]=Math.max(-14,Math.min(14,goal.t[0])); goal.t[2]=Math.max(-2.5,Math.min(12,goal.t[2])); }

/* ---------- the cast on the street ---------- */
/* where each of them is at 02:14: [x, z, heading, pose] */
const SPOTS={danny:[-.6,1.1,.15,'stand'],degsy:[-5.6,-.9,.55,'smoke'],kwame:[-4.4,-1.5,-.25,'stand'],ali:[-7.8,-2.2,.1,'watch'],
  maureen:[1.8,.5,-.9,'stand'],piotr:[4.6,1.4,-.5,'phone'],pcmale:[7.4,3.6,-1.1,'stand'],pcfem:[9,4.4,-1.3,'stand']};
const CAST={};
for(const id of ORDER){ const n=N(STREET,0,PAVE_Y,0); const C=ROSTER[id].kit==='L'?makeCharL(id,n):makeChar(id,n,'cast'); C.node=n; CAST[id]=C;
  const P=C.poses, hy=C.o.thigh+C.o.shin+C.o.foot+.05;
  P.smoke={hipsY:hy,wpn:'fight',j:{armR:[-.4,0,.28],elbowR:[-1.55,0,0],armL:[.08,0,.14],elbowL:[-.25,0,0],spine:[.03,0,0],head:[-.05,.25,0],thighL:[-.06,0,.06],thighR:[.05,0,-.04],kneeL:[.08,0,0]}};
  if(id==='maureen') P.fight={hipsY:hy,wpn:'fight',j:{armR:[-.95,0,.12],elbowR:[-1.15,0,0],armL:[.05,0,.12],elbowL:[-.5,0,0],spine:[.08,0,0],head:[.1,0,0]}};
  if(id==='kwame') P.fight={hipsY:hy,wpn:'fight',j:{armR:[.08,0,-.1],elbowR:[-.35,0,0],armL:[.1,0,.1],elbowL:[-.3,0,0],head:[.06,-.3,0],thighL:[-.04,0,.04]}};
  if(id==='danny'||id==='degsy'||id==='piotr'||id==='ali') P.fight=Object.assign({},P.idle,{wpn:'fight'}); }
function place(){ const n=ORDER.length; ORDER.forEach((id,i)=>{ const C=CAST[id];
    if(state.layout==='lineup'){ C.node.p=[(i-(n-1)/2)*1.05,PAVE_Y,1.4]; C.node.r=[0,0,0]; }
    else { const s=SPOTS[id]; const onRoad=s[1]>KERB_Z; C.node.p=[s[0],onRoad?0:PAVE_Y,s[1]]; C.node.r=[0,s[2],0]; } });
  poseAll(); }
function poseOf(id){ const p=state.pose; if(p==='stand') return state.layout==='lineup'?'fight':SPOTS[id][3]==='stand'?'fight':SPOTS[id][3]; return p==='scared'?'cower':p; }
function poseAll(){ for(const id of ORDER){ const C=CAST[id]; const name=poseOf(id); applyPose(C,name);
  if(state.pose==='handsup'||state.pose==='scared'){ C.J.headMesh.mesh.mats[0]=C.faceM.shock; C.J.headMesh.mesh.runs=null; } skinUpdate(C); } }

/* ---------- freeze-frame, the VR way ----------
   The world stops (time, rain, smoke, the cast) and the colour drains to the grade; the viewer's head does not move.
   The name card is an object in the world at the character's shoulder, turned to face you. In the headset it has to
   earn the look: within 4 m, looking at them for 0.6 s. It lets go after 3.2 s, on a click, or on Escape. */
let frozen=false,frozenT=0,pending=null,lookT=0;
const SEEN=new Set(), KEY_CAST=['degsy','kwame','ali','maureen','piotr','pcmale','pcfem'];
const CARDS={}, CARD=N(STREET); CARD.vis=false;
const NAMEF="'Anton','Impact','Arial Narrow',sans-serif", TYPEF="'Courier Prime','Courier New',monospace";
function cardTex(id){ const R_=ROSTER[id]; return P2(1024,512,(g,w,h)=>{ g.clearRect(0,0,w,h);
    const name=R_.name.replace(/ ".*" /,' ').toUpperCase(), role=R_.role.toUpperCase();
    g.font=`700 34px ${TYPEF}`; g.fillStyle='#000'; g.fillText(role,18,74); g.fillStyle='#f4efe4'; g.fillText(role,14,70);
    g.save(); g.scale(.82,1); const fs=name.length>12?150:196; g.font=`400 ${fs}px ${NAMEF}`; g.fillStyle='#000'; g.fillText(name,24/.82,96+fs*.86+8); g.fillStyle='#f5d02e'; g.fillText(name,14/.82,96+fs*.86); g.restore();
    g.font=`700 36px ${TYPEF}`; const tw=Math.min(w-20,g.measureText(R_.card).width+36); g.fillStyle='#050505'; g.fillRect(10,388,tw,62); g.fillStyle='#ffffff'; g.fillText(R_.card,28,431,w-50); },0,1500); }
function cardFor(id){ if(!CARDS[id]){ CARDS[id]=mk(plane(1.5,.75,2,1),ungraded(M(cardTex(id),{unlit:true,cut:true,double:true})),CARD); } return CARDS[id]; }
const FILL=6, FILL0=STREET_LIGHT.pl[FILL].map(v=>Array.isArray(v)?v.slice():v);
function headOf(id){ const p=CAST[id].node.p; return [p[0],p[1]+1.62,p[2]]; }
function freezeOn(id,walkUp){ if(walkUp!==false){ const C=CAST[id],p=C.node.p,h=C.node.r[1]+.35,d=2.1;
    /* the viewer walks up to them: eye height, 2.1 m in front and a little to one side, then the world stops */
    state.eye=true; setGoal({t:[p[0]+Math.sin(h)*d,PAVE_Y+1.65,Math.min(KERB_Z+1.2,p[2]+Math.cos(h)*d)],th:h,ph:1.6,r:.04}); renderCard(); pending={id,t:.7}; return; }
  const th=cam.th,right=[Math.cos(th),0,-Math.sin(th)],hd=headOf(id);
  for(const k in CARDS) CARDS[k].vis=false; const c=cardFor(id); c.vis=true; CARD.vis=true;
  CARD.p=[hd[0]+right[0]*.95+Math.sin(th)*.25,hd[1]-.05,hd[2]+right[2]*.95+Math.cos(th)*.25]; CARD.r=[0,th,-.05];
  STREET_LIGHT.pl[FILL]=[[hd[0]+Math.sin(th)*1.3,hd[1]+.35,hd[2]+Math.cos(th)*1.3],[1.0,.95,.88],4.2];
  state.pick=id; SEEN.add(id); frozen=true; frozenT=0; document.body.classList.add('frozen'); renderCard(); }
function unfreeze(){ pending=null; if(!frozen) return; frozen=false; CARD.vis=false; STREET_LIGHT.pl[FILL]=FILL0.map(v=>Array.isArray(v)?v.slice():v); document.body.classList.remove('frozen'); renderCard(); }
function lookTick(dt){ if(!state.eye||frozen||pending||window.__CAPTURE) { lookT=0; return; } const e=eyePos(),f=[-Math.sin(cam.th)*Math.sin(cam.ph),-Math.cos(cam.ph),-Math.cos(cam.th)*Math.sin(cam.ph)];
  for(const id of KEY_CAST){ if(SEEN.has(id)) continue; const hd=headOf(id),d=[hd[0]-e[0],hd[1]-e[1],hd[2]-e[2]],L=Math.hypot(...d); if(L>4) continue;
    const cosA=(d[0]*f[0]+d[1]*f[1]+d[2]*f[2])/L; if(cosA>Math.cos(.3)){ lookT+=dt; if(lookT>.6){ lookT=0; freezeOn(id,false); } return; } } lookT=0; }

/* ---------- card ---------- */
const card=document.getElementById('card'), clockEl=document.getElementById('clock');
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
function segOf(opts,cur,onPick){ const s=el('div','seg'); for(const [v,label] of opts){ const b=el('button',null,label); b.type='button'; b.dataset.v=v; b.setAttribute('aria-pressed',String(v===cur)); b.addEventListener('click',()=>{ s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); onPick(v); }); s.append(b); } return s; }
function renderCard(){ card.innerHTML='';
  card.append(el('p','sub','Case file · the cast'),el('h2',null,'Who\'s out at 2 a.m.'));
  card.append(el('p','body','Pick someone and you walk up to them; the street stops for their freeze-frame. At eye level, just look at someone close by for a moment.'));
  const row=el('div','row'); card.append(row);
  const eb=el('button','btn',state.eye?'Back to the overview':'Eye level (1.65 m)'); eb.type='button'; eb.setAttribute('aria-pressed',String(state.eye)); eb.addEventListener('click',()=>setEye(!state.eye)); row.append(eb);
  row.append(segOf([['street','On the street'],['lineup','Line-up']],state.layout,v=>{ state.layout=v; unfreeze(); place(); setGoal(v==='lineup'?{t:[0,1.05,1.4],th:0,ph:1.42,r:innerWidth>760?7.4:9.6}:HOME); }));
  card.append(el('p','seg-label','Show them'),segOf([['stand','As they are'],['handsup','Hands up'],['scared','Scared'],['hurt','Hurt']],state.pose,p=>{ state.pose=p; poseAll(); }));
  const ul=el('ul','list');
  for(const id of ORDER){ const R_=ROSTER[id],li=el('li'),b=el('button'); b.type='button'; b.setAttribute('aria-pressed',String(state.pick===id&&frozen));
    const lead=el('span','dot'); lead.style.background=R_.color;
    const txt=el('span'); txt.style.minWidth='0'; const sd=SIDES[R_.side]; txt.append(el('span','tag '+sd[0],sd[1]),el('b',null,R_.name),el('span','who',R_.role.split(' · ')[1]||''),el('small',null,R_.note));
    b.append(lead,txt); b.addEventListener('click',()=>{ freezeOn(id); }); li.append(b); ul.append(li); }
  card.append(ul);
  const w=el('p','note'); w.append(el('b',null,'The Old Bill. '),'One star brings PC Hughes on foot. Two brings PC Okafor in the car, and she runs. Lose them both and the street goes back to normal, but Ali\'s camera saw everything.'); card.append(w); }
function updateClock(){ clockEl.innerHTML=''; clockEl.append(el('b',null,'02:14'),'Bethnal Green Rd · E2'); }

const $=id=>document.getElementById(id);
function syncLook(){ LOOK.grade=$('grade').checked; LOOK.grain=$('grain').checked; state.rain=$('rain').checked; RAIN.vis=state.rain; }
document.querySelectorAll('.look input').forEach(i=>i.addEventListener('change',syncLook));
syncLook();

/* ---------- loop ---------- */
function resize(){ const wide=innerWidth>760; viewShift[0]=wide?Math.min(.3,260/innerWidth*1.1):0; viewShift[1]=wide?.04:-.3;
  const dpr=Math.min(devicePixelRatio||1,2); const w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
let lastT=performance.now(),clock=0,wclock=0;
function draw(){ drawLondon(eyePos(),cam.t); }
function step(dt){ clock+=dt; if(!frozen) wclock+=dt; LOOK.time=clock;
  if(pending){ pending.t-=dt; if(pending.t<=0){ const id=pending.id; pending=null; freezeOn(id,false); } }
  if(frozen){ frozenT+=dt; if(frozenT>3.2&&!window.__CAPTURE) unfreeze(); } lookTick(dt);
  LOOK.freeze+=((frozen?1:0)-LOOK.freeze)*(1-Math.exp(-dt*12));
  const k=1-Math.exp(-dt*(frozen?9:6)); for(let i=0;i<3;i++) cam.t[i]+=(goal.t[i]-cam.t[i])*k; cam.th+=(goal.th-cam.th)*k; cam.ph+=(goal.ph-cam.ph)*k; cam.r+=(goal.r-cam.r)*k;
  if(!frozen) for(const id of ORDER){ const C=CAST[id]; animateChar(C,wclock); skinUpdate(C); }
  if(state.eye){ const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s_=(keys.KeyD?1:0)-(keys.KeyA?1:0); if(f||s_) walk(f*1.6*dt,s_*1.6*dt); }
  rainTick(wclock,eyePos()); const fl=Math.sin(wclock*31)>.97&&Math.sin(wclock*3.1)>.6; STREET_LIGHT.pl[1][1]=fl?[.5,.22,.15]:[1.35,.62,.42]; setLights(STREET_LIGHT);
  resize(); draw(); }
function frame(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now; step(dt); requestAnimationFrame(frame); }
if(window.__CAPTURE) document.body.classList.add('capture');
place(); renderCard(); updateClock(); setGoal(HOME,true); setLights(STREET_LIGHT);
const ld=document.getElementById('loading'); if(ld) ld.hidden=true;
window.__london={state,CAST,setGoal,freezeOn,unfreeze,place,poseAll,step,cam,goal};
if(!window.__CAPTURE) requestAnimationFrame(frame);
})();

</script>
