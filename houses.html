<title>House Calls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a full-bleed low-res 3D viewport. Title and views top-left, look settings top-right, a working card bottom-left.
   One look: suburbs at 2 a.m. Porch-light amber on near-black, a cold TV blue, and a red that only shows up for blood and warnings. */
:root{
  --bg:#0a0b0d; --panel:rgba(10,11,13,.9); --line:#2c2e33; --ink:#ece6da; --ink2:#c6c0b4; --muted:#8a867e;
  --brass:#e8a33d; --sakura:#e8a33d; --signal:#d0453a; --jade:#7fa8d8;
  --display:'Big Shoulders Display','Arial Narrow','Impact',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated;outline:none}
#view:active{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto;box-sizing:border-box}
.brand{grid-column:1;grid-row:1;align-self:start;justify-self:start;display:grid;gap:10px;min-width:0}
.kick{margin:0;font:600 11px/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);text-shadow:0 0 8px #000}
.kick b{color:var(--brass);font-weight:600}
.brand h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,7vw,78px);line-height:.86;letter-spacing:.01em;text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,.6)}
.brand h1 span{color:var(--sakura)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:10px 14px;border:1px solid var(--line);background:var(--panel)}
.tabs a:hover{border-color:var(--brass)}
.tabs a[aria-current="page"]{background:var(--brass);color:#14100a;border-color:var(--brass)}
.look{grid-column:2;grid-row:1;align-self:start;background:var(--panel);border:1px solid var(--line);width:240px;max-width:100%}
.look summary{cursor:pointer;padding:11px 14px;font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:16px}
.look summary::-webkit-details-marker{display:none}
.look summary::after{content:'+';color:var(--muted)}
.look[open] summary::after{content:'\2013'}
.look-body{display:grid;gap:10px;padding:2px 14px 14px;font-size:13px}
.look label{display:flex;gap:9px;align-items:center;cursor:pointer}
.look input[type=checkbox]{accent-color:var(--brass);width:15px;height:15px;margin:0}
.look .master{font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--line)}
.look .dim{opacity:.4;pointer-events:none}
.seg{display:flex;min-width:0;flex-wrap:wrap}
.seg button{flex:1;font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--line);margin:0 -1px -1px 0;padding:9px 6px;cursor:pointer;white-space:nowrap}
.seg button:hover{border-color:var(--brass)}
.seg button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100a;position:relative}
.seg-label{font:600 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.card{grid-column:1;grid-row:3;align-self:end;justify-self:start;width:min(470px,100%);background:var(--panel);border:1px solid var(--line);padding:16px 18px 12px;display:grid;gap:12px;max-height:56vh;overflow:auto}
.card .sub{margin:0;font:600 10.5px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.card h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:34px;line-height:.95;letter-spacing:.01em;text-wrap:balance}
.card .body{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:62ch}
.card .body b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0;padding:0;list-style:none}
.chips li{display:flex;gap:6px;align-items:center;font:500 11px/1 var(--mono);color:var(--ink2);letter-spacing:.04em}
.chips i{display:inline-block;width:18px;height:18px;border:1px solid rgba(255,255,255,.18)}
.card ul.list{list-style:none;margin:0;padding:0;display:grid}
.list li button{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:13.5px;padding:9px 2px;cursor:pointer}
.list li button:hover b,.list li button[aria-pressed="true"] b{color:var(--brass)}
.list li .num{font:600 11px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list li button[aria-pressed="true"] .num{color:var(--brass)}
.list li .who{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.list li b{font-weight:700}
.list li small{display:none;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
.list li button[aria-pressed="true"] small{display:block}
.list li .sw{display:flex;gap:2px;align-self:center}
.list li .sw i{display:block;width:7px;height:14px}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row>*{min-width:0}
.btn{font:600 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#14100a;background:var(--ink);border:1px solid var(--ink);padding:0 14px;cursor:pointer;min-height:36px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100a}
.hint{grid-column:2;grid-row:3;align-self:end;justify-self:end;margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-shadow:0 0 6px #000;text-align:right;line-height:1.5}
#clock{grid-column:2;grid-row:2;align-self:start;justify-self:end;text-align:right;font:600 12px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-shadow:0 0 8px #000}
#clock b{display:block;font:800 34px/1 var(--display);letter-spacing:.02em;color:var(--ink)}
a:focus-visible,button:focus-visible,summary:focus-visible,#view:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#err{position:fixed;inset:auto 16px 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--signal);font-size:13px;line-height:1.5}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);background:var(--bg)}
@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .look{grid-column:1;grid-row:2;justify-self:start;width:100%}
  #clock{grid-column:1;grid-row:3}
  .card{grid-row:4;max-height:44vh;width:100%}
  .hint{display:none}
  .brand h1{font-size:42px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

.tag{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line);color:var(--ink2);margin-right:4px}
.tag.kid{border-color:var(--jade);color:var(--jade)}
.tag.civ{border-color:#8a867e}
.tag.crew{border-color:var(--signal);color:#f0a096}
.tag.target{background:var(--signal);border-color:var(--signal);color:#fff}
.word{margin:0;padding:10px 12px;border-left:3px solid var(--brass);background:rgba(232,163,61,.07);font-size:13px;line-height:1.55;color:var(--ink2)}
.word b{color:var(--ink)}
</style>

<canvas id="view" tabindex="0" aria-label="3D view of the House Calls art direction set. Drag to orbit, scroll or pinch to zoom, arrow keys also orbit."></canvas>
<div class="hud">
  <header class="brand">

<script>
'use strict';
(function(){
const cv=document.getElementById('view');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
const errBox=document.getElementById('err');
function fail(msg){ errBox.textContent=msg; errBox.hidden=false; }
if(!gl){ fail('This page needs WebGL2, which this browser has turned off. Try the Quest browser, or Chrome, Firefox or Safari.'); return; }

/* ================= math ================= */
const m4={
  make(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
  mul(o,a,b){ for(let c=0;c<4;c++){ const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3; o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3; o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3; } return o; },
  persp(o,fovy,aspect,near,far){ const f=1/Math.tan(fovy/2); o.fill(0); o[0]=f/aspect; o[5]=f; o[10]=(far+near)/(near-far); o[11]=-1; o[14]=2*far*near/(near-far); return o; },
  lookAt(o,e,c,up){
    let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2]; let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx; l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0; o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0; o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]); o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]); o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1; return o; },
  compose(o,p,r,s){
    const a=Math.cos(r[0]),b=Math.sin(r[0]),c=Math.cos(r[1]),d=Math.sin(r[1]),e=Math.cos(r[2]),f=Math.sin(r[2]);
    const ae=a*e,af=a*f,be=b*e,bf=b*f;
    o[0]=c*e*s[0]; o[1]=(af+be*d)*s[0]; o[2]=(bf-ae*d)*s[0]; o[3]=0;
    o[4]=-c*f*s[1]; o[5]=(ae-bf*d)*s[1]; o[6]=(be+af*d)*s[1]; o[7]=0;
    o[8]=d*s[2]; o[9]=-b*c*s[2]; o[10]=a*c*s[2]; o[11]=0;
    o[12]=p[0]; o[13]=p[1]; o[14]=p[2]; o[15]=1; return o; }
};
const norm3=v=>{ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const rng=seed=>()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

/* ================= scene graph ================= */
class Node{ constructor(){ this.p=[0,0,0]; this.r=[0,0,0]; this.s=[1,1,1]; this.kids=[]; this.vis=true; this.local=m4.make(); this.world=m4.make(); this.mesh=null; this.par=null; }
  add(n){ this.kids.push(n); n.par=this; return n; } }
function N(parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=new Node(); n.p=[x,y,z]; n.r=[rx,ry,rz]; if(parent) parent.add(n); return n; }
function mk(geo,mats,parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=N(parent,x,y,z,rx,ry,rz); n.mesh={geo,mats:Array.isArray(mats)?mats:[mats],runs:null}; return n; }
function setParent(n,p){ if(n.par===p) return; if(n.par){ const i=n.par.kids.indexOf(n); if(i>=0) n.par.kids.splice(i,1); } p.add(n); }
function updateWorld(n,pw){ if(!n.vis) return; m4.compose(n.local,n.p,n.r,n.s); if(pw) m4.mul(n.world,pw,n.local); else n.world.set(n.local); for(const k of n.kids) updateWorld(k,n.world); }

/* ================= geometry ================= */
let GEO_TEMP=false;
class Geo{ constructor(){ this.P=[]; this.Nm=[]; this.T=[]; this.I=[]; this.groups=[]; this.vao=null; this.bufs=null; this.temp=GEO_TEMP; }
  v(p,n,t){ this.P.push(p[0],p[1],p[2]); this.Nm.push(n[0],n[1],n[2]); this.T.push(t[0],t[1]); return this.P.length/3-1; } }
function shift(g,x,y,z){ for(let i=0;i<g.P.length;i+=3){ g.P[i]+=x; g.P[i+1]+=y; g.P[i+2]+=z; } return g; }
function flatNormals(g){ for(let i=0;i<g.I.length;i+=3){ const a=g.I[i]*3,b=g.I[i+1]*3,c=g.I[i+2]*3,P=g.P;
  const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2];
  const n=norm3([uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx]); for(const k of [a,b,c]){ g.Nm[k]=n[0]; g.Nm[k+1]=n[1]; g.Nm[k+2]=n[2]; } } return g; }
const FACES=[[[1,0,0],[0,0,-1],[0,1,0],'d','h','w'],[[-1,0,0],[0,0,1],[0,1,0],'d','h','w'],[[0,1,0],[1,0,0],[0,0,-1],'w','d','h'],[[0,-1,0],[1,0,0],[0,0,1],'w','d','h'],[[0,0,1],[1,0,0],[0,1,0],'w','h','d'],[[0,0,-1],[-1,0,0],[0,1,0],'w','h','d']];
function box(w,h,d,o={}){
  const g=new Geo(),S={w,h,d};
  FACES.forEach(([n,U,V,ku,kv,ko],fi)=>{ const start=g.I.length,base=g.P.length/3,du=S[ku]/2,dv=S[kv]/2,off=S[ko]/2;
    for(const [a,b] of [[-1,-1],[1,-1],[1,1],[-1,1]]) g.v([0,1,2].map(k=>n[k]*off+U[k]*a*du+V[k]*b*dv),n,[(a+1)/2,(b+1)/2]);
    g.I.push(base,base+1,base+2,base,base+2,base+3); g.groups.push({start,count:6,mi:fi}); });
  if(o.tw!==undefined||o.td!==undefined){ const tw=o.tw??1,td=o.td??1; for(let i=0;i<g.P.length;i+=3) if(g.P[i+1]>0){ g.P[i]*=tw; g.P[i+2]*=td; } flatNormals(g); }
  if(o.pivot==='t') shift(g,0,-h/2,0); else if(o.pivot==='b') shift(g,0,h/2,0);
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]);
  return g;
}
function plane(w,h,sx=1,sy=1){ const g=new Geo();
  for(let j=0;j<=sy;j++) for(let i=0;i<=sx;i++) g.v([(i/sx-.5)*w,(j/sy-.5)*h,0],[0,0,1],[i/sx,j/sy]);
  for(let j=0;j<sy;j++) for(let i=0;i<sx;i++){ const a=j*(sx+1)+i,b=a+1,c=a+sx+2,d=a+sx+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
function cyl(rt,rb,h,seg,o={}){ const g=new Geo(),hh=h/2,slope=(rb-rt)/h;
  for(let j=0;j<=1;j++){ const y=j?hh:-hh,r=j?rt:rb; for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2,sx=Math.sin(a),cz=Math.cos(a); g.v([r*sx,y,r*cz],norm3([sx,slope,cz]),[i/seg,j]); } }
  for(let i=0;i<seg;i++){ const a=i,b=i+1,c=i+seg+2,d=i+seg+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0});
  if(!o.open){ for(const top of [1,0]){ const start=g.I.length,y=top?hh:-hh,r=top?rt:rb,ny=top?1:-1; const c=g.v([0,y,0],[0,ny,0],[.5,.5]);
    for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; g.v([r*Math.sin(a),y,r*Math.cos(a)],[0,ny,0],[.5+Math.sin(a)/2,.5+Math.cos(a)/2]); }
    for(let i=0;i<seg;i++){ if(top) g.I.push(c,c+1+i,c+2+i); else g.I.push(c,c+2+i,c+1+i); }
    g.groups.push({start,count:g.I.length-start,mi:top?1:2}); } }
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]); return g; }
function torus(R,r,rs,ts){ const g=new Geo();
  for(let j=0;j<=rs;j++) for(let i=0;i<=ts;i++){ const u=i/ts*Math.PI*2,v=j/rs*Math.PI*2,cx=R*Math.cos(u),cy=R*Math.sin(u);
    const p=[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)]; g.v(p,norm3([p[0]-cx,p[1]-cy,p[2]]),[i/ts,j/rs]); }
  for(let j=1;j<=rs;j++) for(let i=1;i<=ts;i++){ const a=(ts+1)*j+i-1,b=(ts+1)*(j-1)+i-1,c=(ts+1)*(j-1)+i,d=(ts+1)*j+i; g.I.push(a,b,d,b,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
/* merge axis-aligned boxes into one single-material geometry (one draw call) */
function mergeBoxes(list){ const g=new Geo();
  for(const it of list){ const b=box(it[3],it[4],it[5]); const base=g.P.length/3;
    for(let i=0;i<b.P.length;i+=3) g.P.push(b.P[i]+it[0],b.P[i+1]+it[1],b.P[i+2]+it[2]);
    for(const v of b.Nm) g.Nm.push(v);
    for(let i=0;i<b.T.length;i+=2){ g.T.push(b.T[i]*(it[6]||1),b.T[i+1]*(it[7]||1)); }
    for(const ix of b.I) g.I.push(ix+base); }
  g.groups=[{start:0,count:g.I.length,mi:0}]; return g; }

/* ================= textures ================= */

/* ---------- canvas painting helpers: smooth gradients first, the PS1 pass quantises them ---------- */
function P2(w,h,fn,gr=0,seed=1){ return tex(w,h,null,g=>{ fn(g,w,h); if(gr) grain(g,gr,seed); }); }
function grad(g,x0,y0,x1,y1,stops){ const q=g.createLinearGradient(x0,y0,x1,y1); for(const [t,c] of stops) q.addColorStop(t,c); return q; }
function vfill(g,x,y,w,h,stops){ g.fillStyle=grad(g,0,y,0,y+h,stops); g.fillRect(x,y,w,h); }
function hfill(g,x,y,w,h,stops){ g.fillStyle=grad(g,x,0,x+w,0,stops); g.fillRect(x,y,w,h); }
function radial(g,cx,cy,r,stops){ const q=g.createRadialGradient(cx,cy,0,cx,cy,r); for(const [t,c] of stops) q.addColorStop(t,c); g.fillStyle=q; g.fillRect(cx-r,cy-r,r*2,r*2); }
function ell(g,cx,cy,rx,ry,col){ g.fillStyle=col; g.beginPath(); g.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); g.fill(); }
function poly(g,pts,col){ g.fillStyle=col; g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); g.fill(); }
function rgba(hex,a){ const [r,g_,b]=hexRGB(hex); return `rgba(${r},${g_},${b},${a})`; }

/* =====================================================================================================
   CAST KIT: the generic pieces every art set builds characters with: women's and kids' body shapes on the rig,
   faces painted on demand, hair, hats, skirts, poses (including civilians' hands up and cowering), makeChar().
   Each page supplies its own HEADS entries, painted outfits and ROSTER.
   ===================================================================================================== */
/* ---------- body shapes: the rig's torso rings are a man's. A woman's and a child's are reshaped here before rigging. ---------- */
const SHAPES={
  fem:{rx:{0.86:1.05,0.93:1.12,1:1.06,1.08:.86,1.18:.9,1.28:.97,1.38:.86,1.45:.84},rz:{0.93:1.06,1.18:1.02,1.28:1.16,1.38:1.04},cz:{0.93:-.012,1.28:.022,1.38:.01}},
  kid:{rx:{1.08:1.04,1.18:1.02,1.28:.94,1.38:.9,1.45:.9},rz:{1:1.06,1.08:1.1,1.18:1.04},cz:{1.08:.01}},
  teen:{rx:{0.93:1.06,1.08:.9,1.28:.95,1.38:.88,1.45:.86},rz:{1.28:1.06},cz:{1.28:.01}}
};
function shapedRig(o,parent,shape){ const S=SHAPES[shape]; if(!S) return rig(o,parent); const keep=TORSO.map(r=>r.slice());
  for(const r of TORSO){ const y=String(r[0]); if(S.rx[y]) r[1]*=S.rx[y]; if(S.rz[y]) r[2]*=S.rz[y]; if(S.cz[y]) r[3]+=S.cz[y]; }
  try{ return rig(o,parent); } finally { keep.forEach((r,i)=>{ for(let k=0;k<4;k++) TORSO[i][k]=r[k]; }); } }

const FACE_EX=['fight','hurt','beg','sleep','agony','shock','choke'];
function lazyFaces(C,k,kid){ for(const ex of FACE_EX){ let m=null; const paint=kid&&ex!=='fight'&&ex!=='sleep'?'shock':ex;
    Object.defineProperty(C.faceM,ex,{configurable:true,enumerable:true,get(){ if(!m){ FACE[k]=FACE[k]||{}; FACE[k][paint]=FACE[k][paint]||paintHead(HEADS[k],paint); m=M(FACE[k][paint]); } return m; }}); } }

    for(let i=0;i<n;i++) for(let j=0;j<rows;j++){ const q0=p0+len*i/n,q1=p0+len*(i+1)/n,m=(q0+q1)/2,r0=y0+(y1-y0)*j/rows,r1=y0+(y1-y0)*(j+1)/rows; const geo=wallPiece(q1-q0,r0,r1,alongX?q0:-q1,tw);

  light(H,[-3.0,2.3,2.7],[1.3,1.05,.7],6,'bulb'); const fpl=light(H,[-11.2,.6,2.5],[1.6,.7,.25],5.5); flicker(H,fpl,'fire'); light(H,[-7.3,2.4,5.9],[1.4,.9,.45],5,'bulb'); light(H,[8.2,2.2,-1],[1.4,1.0,.5],7.5,'bulb'); light(H,[-6.6,1.1,-1.3],[1.0,.8,.5],2.8);
  /* people */
  who(H,'kane',-10.2,3.6,1.25,'fight'); who(H,'mae',-9.4,5.9,0,'sit'); who(H,'jesse',-5.2,-3.35,Math.PI,'watch'); who(H,'cook',-4.1,4.0,0,'idle');
  who(H,'hand',8.6,4.9,0,'idle'); who(H,'hand',2.9,-.3,-1.6,'idle'); who(H,'hand',9.6,-1.0,Math.PI/2,'fight');
  return H; }

const HOUSE_BUILDERS={pine:buildPine,maple:buildMaple,crest:buildCrest,sallis:buildSallis,kane:buildKane};
const HS={};
function getHouse(k){ if(!HS[k]){ GEO_TEMP=false; HS[k]=HOUSE_BUILDERS[k](); } return HS[k]; }


/* =====================================================================================================
   VIEWS, CAMERA, LIGHT, LOOP. Two views: the houses (one cutaway at a time) and the cast, a line-up per house
   against a height chart so the proportions read: men, women, a 13-year-old, a 6-year-old.
   ===================================================================================================== */
const state={view:'houses',house:'pine',ps1:true,res:480,snap:true,affine:true,dither:true,roof:false,people:true,castHouse:'pine',castPose:'stand',focus:null};
const TIMES={pine:'01:40',maple:'02:10',crest:'23:55',sallis:'03:20',kane:'04:05'};
const SHORT={pine:'Pine Hollow',maple:'Maple Ct',crest:'Crestline',sallis:'Sallis',kane:'Kane'};
const cam={t:[0,1,0],th:.5,ph:.9,r:18},goal={t:[0,1,0],th:.5,ph:.9,r:18};
function setGoal(c,instant){ goal.t=c.t.slice(); goal.ph=c.ph; goal.r=c.r; let th=c.th; while(th-cam.th>Math.PI) th-=Math.PI*2; while(th-cam.th<-Math.PI) th+=Math.PI*2; goal.th=th; if(instant){ cam.t=goal.t.slice(); cam.th=goal.th; cam.ph=goal.ph; cam.r=goal.r; } }
function effR(){ const asp=cv.width/Math.max(1,cv.height); return cam.r*Math.max(1,(asp<.8?.82:1.1)/asp); }
function eyePos(){ const r=effR(); return [cam.t[0]+r*Math.sin(cam.ph)*Math.sin(cam.th),cam.t[1]+r*Math.cos(cam.ph),cam.t[2]+r*Math.sin(cam.ph)*Math.cos(cam.th)]; }
const LIM={houses:[1.6,40],cast:[1.2,16]};
const clampGoal=()=>{ goal.ph=Math.min(1.56,Math.max(.08,goal.ph)); const l=LIM[state.view]; goal.r=Math.min(l[1],Math.max(l[0],goal.r)); };
const ptrs=new Map(); let lastPinch=0,panMode=false;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); panMode=e.button===2||e.shiftKey; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastPinch=Math.hypot(a.x-b.x,a.y-b.y); } });
cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastPinch) goal.r*=lastPinch/d; lastPinch=d; pan(dx/2,dy/2); }
  else if(panMode) pan(dx,dy); else { goal.th-=dx*.006; goal.ph-=dy*.005; } clampGoal(); });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) lastPinch=0; };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr); cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ e.preventDefault(); goal.r*=Math.exp(e.deltaY*.0012); clampGoal(); },{passive:false});
cv.addEventListener('keydown',e=>{ const k={ArrowLeft:[.12,0],ArrowRight:[-.12,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key];
  if(k){ e.preventDefault(); goal.th+=k[0]; goal.ph+=k[1]; clampGoal(); } if(e.key==='+'||e.key==='='){ goal.r*=.9; clampGoal(); } if(e.key==='-'){ goal.r*=1.1; clampGoal(); } });
function pan(dx,dy){ const s=goal.r*.0016; const rx=Math.cos(cam.th),rz=-Math.sin(cam.th); goal.t[0]-=rx*dx*s; goal.t[2]-=rz*dx*s; goal.t[1]+=dy*s; goal.t[1]=Math.max(-.5,Math.min(6,goal.t[1])); for(const i of [0,2]) goal.t[i]=Math.max(-25,Math.min(25,goal.t[i])); }

/* ---------- the cast stage: a height chart wall, one line-up per house ---------- */
const STAGE=N(world); STAGE.vis=false;
const tChart=P2(64,128,(g,w,h)=>{ vfill(g,0,0,w,h,[[0,'#3a3c40'],[1,'#2a2c30']]); for(let cm=0;cm<=260;cm+=10){ const y=h-(cm/260)*h|0; const big=cm%50===0; R(g,big?'#d8d4c8':'#6a6c70',0,y,big?w:14,1); if(big&&cm>0&&cm<260) text(g,String(cm),18,y-7,'#d8d4c8'); } },3,991);
mk(plane(30,WH,30,2),M(tChart,{repeat:[25,1]}),STAGE,0,WH/2,-.65); floor({g:STAGE},-15,-.65,15,9,tFlConc,{tile:2});
const STAGE_LIGHT={amb:[.42,.4,.42],dir:[-.4,.6,.7],dirCol:[.7,.62,.56],fog:[.04,.042,.05],fogNear:40,fogFar:90,pl:[[[-3,2.4,2],[.8,.7,.6],6],[[3,2.4,2],[.8,.7,.6],6],[[0,1.6,4],[.4,.42,.5],8]]};
const LINEUPS={};
const SIDE_ORDER={target:0,crew:1,civ:2,kid:3};
function lineup(k){ if(LINEUPS[k]) return LINEUPS[k]; const ids=Object.keys(ROSTER).filter(id=>ROSTER[id].house===k).sort((a,b)=>SIDE_ORDER[ROSTER[a].side]-SIDE_ORDER[ROSTER[b].side]);
  const g=N(STAGE), X=ids.map((_,i)=>(i-(ids.length-1)/2)*1.05), chars=[];
  ids.forEach((id,i)=>{ const n=N(g,X[i],0,.35,0,0,0); const C=makeChar(id,n,'cast'); chars.push(C); });
  LINEUPS[k]={g,ids,X,chars}; poseLineup(LINEUPS[k]); return LINEUPS[k]; }
function poseLineup(Lu){ const p=state.castPose; Lu.chars.forEach((C,i)=>{ const R_=ROSTER[Lu.ids[i]], fighter=R_.side==='target'||R_.side==='crew';
  const name=p==='stand'?(fighter?'fight':'idle'):p==='handsup'?'handsup':p==='scared'?'cower':p; applyPose(C,name);
  if(p==='handsup'||p==='scared'){ C.J.headMesh.mesh.mats[0]=C.faceM.shock; C.J.headMesh.mesh.runs=null; } skinUpdate(C); }); }

/* ---------- light ---------- */
let curHouse=null;
function applyLight(){ if(state.view==='cast'){ setLights(STAGE_LIGHT); return; } const H=curHouse; setLights(Object.assign({},MOON,{pl:H.lights})); }
function flickerTick(t){ if(state.view!=='houses'||!curHouse) return; for(const f of curHouse.flick){ const base=curHouse.lights[f.i][1];
  const k=f.f==='tv'?.62+.38*Math.abs(Math.sin(t*7.3+Math.sin(t*2.1)*3))*(Math.sin(t*.9)>.85?.4:1):f.f==='fire'?.82+.12*Math.sin(t*9)+.06*Math.sin(t*23):.85+.15*Math.sin(t*1.6);
  for(let c=0;c<3;c++) L.plCol[f.i*3+c]=base[c]*k; } }

/* ---------- views ---------- */
function showHouse(k,instant){ for(const key in HS) HS[key].g.vis=false; state.house=k; curHouse=getHouse(k); curHouse.g.vis=state.view==='houses'; curHouse.roof.vis=state.roof;
  for(const C of curHouse.chars) C.node.vis=state.people; state.focus=null; if(state.view==='houses'){ setGoal(curHouse.cam,instant); applyLight(); if(card.isConnected){ renderCard(); updateClock(); } } }
function showLineup(k,instant){ state.castHouse=k; const Lu=lineup(k); for(const key in LINEUPS) LINEUPS[key].g.vis=key===k; const w=Lu.X.length*1.05, wide=innerWidth>760; if(state.view==='cast') setGoal({t:[wide?-.35:0,.95,.35],th:0,ph:1.4,r:wide?Math.max(5.2,w*1.3+1.2):w*1.15+1.4},instant); }
function setView(v,instant){ if(v!=='cast') v='houses'; state.view=v; HOUSES.vis=v==='houses'; STAGE.vis=v==='cast';
  if(v==='houses') showHouse(state.house,instant); else showLineup(state.castHouse,instant);
  document.querySelectorAll('.tabs a[data-view]').forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  applyLight(); renderCard(); updateClock(); }

/* ---------- card ---------- */
const card=document.getElementById('card'), clockEl=document.getElementById('clock');
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
function segOf(opts,cur,onPick){ const s=el('div','seg'); for(const [v,label] of opts){ const b=el('button',null,label); b.type='button'; b.dataset.v=v; b.setAttribute('aria-pressed',String(v===cur)); b.addEventListener('click',()=>{ s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); onPick(v); }); s.append(b); } return s; }
const TAGS_={target:['target','Target'],crew:['crew','Crew'],civ:['civ','Lives here'],kid:['kid','Kid · can\'t be hurt']};
function peopleList(items,onPick){ const ul=el('ul','list'); items.forEach(it=>{ const li=el('li'),b=el('button'); b.type='button'; b.setAttribute('aria-pressed','false');
    const lead=el('span','num'); lead.style.cssText=`width:10px;height:10px;background:${it.color};align-self:center`;
    const txt=el('span'); txt.style.minWidth='0'; const t=el('span','tag '+TAGS_[it.side][0],TAGS_[it.side][1]); txt.append(t,el('b',null,it.name)); txt.append(el('span','who',it.role)); txt.append(el('small',null,it.note));
    b.append(lead,txt,el('span','num',it.right||'')); b.addEventListener('click',()=>{ ul.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); onPick(it); }); li.append(b); ul.append(li); }); return ul; }
function renderCard(){ card.innerHTML='';
  if(state.view==='houses'){ const H=curHouse, i=HOUSES_ORDER.indexOf(H.key);
    card.append(el('p','sub',`House ${H.num} of 5 · ${H.kind}`),el('h2',null,H.name),el('p','body',H.note));
    const w=el('p','word'); w.append(el('b',null,'How it plays. '),H.plays); card.append(w);
    const row=el('div','row'); const prev=el('button','btn ghost','‹ '+(i>0?SHORT[HOUSES_ORDER[i-1]]:'')), next=el('button','btn ghost',(i<4?SHORT[HOUSES_ORDER[i+1]]:'')+' ›'), all=el('button','btn','Whole house');
    for(const b of [all,prev,next]) b.type='button'; prev.disabled=i===0; next.disabled=i===4; for(const b of [prev,next]) if(b.disabled) b.style.opacity=.35;
    prev.addEventListener('click',()=>{ if(i>0) showHouse(HOUSES_ORDER[i-1]); }); next.addEventListener('click',()=>{ if(i<4) showHouse(HOUSES_ORDER[i+1]); });
    all.addEventListener('click',()=>{ setGoal(H.cam); renderCard(); }); row.append(all,prev,next); card.append(row);
    card.append(el('p','seg-label','Rooms'),segOf(H.rooms.map((r,k)=>[k,r.name.split(' · ')[0]]),null,k=>setGoal(H.rooms[k].cam)));
    const seen=new Set(), list=[]; for(const p of H.people){ if(seen.has(p.id)) continue; seen.add(p.id); const R_=ROSTER[p.id], n=H.people.filter(q=>q.id===p.id).length; list.push(Object.assign({id:p.id,p,right:n>1?'×'+n:''},R_)); }
    list.sort((a,b)=>SIDE_ORDER[a.side]-SIDE_ORDER[b.side]);
    card.append(el('p','seg-label','Home tonight'),peopleList(list,it=>{ const p=it.p; setGoal({t:[p.x,p.y+.9,p.z],th:cam.th,ph:.62,r:4.2}); }));
  } else {
    card.append(el('p','sub','The cast · on the Stairwell rig'),el('h2',null,'Who\'s home'));
    card.append(el('p','body','Same skinned body, painted faces and gun holds as the tower cast. New here: women\'s and kids\' body shapes, long hair, skirts, and faces that paint only when a pose needs them.'));
    card.append(el('p','seg-label','House'),segOf(HOUSES_ORDER.map(k=>[k,SHORT[k]]),state.castHouse,k=>{ showLineup(k); renderCard(); }));
    card.append(el('p','seg-label','Show them'),segOf([['stand','Standing'],['handsup','Hands up'],['scared','Scared'],['beg','Begging'],['hurt','Hurt']],state.castPose,p=>{ state.castPose=p; for(const k in LINEUPS) poseLineup(LINEUPS[k]); }));
    const Lu=lineup(state.castHouse);
    card.append(peopleList(Lu.ids.map((id,i)=>Object.assign({id,i},ROSTER[id])),it=>setGoal({t:[Lu.X[it.i],1.1,.35],th:0,ph:1.42,r:2.6})));
    const w=el('p','word'); w.append(el('b',null,'Kids. '),'They\'re in the houses and they can\'t be hurt: bullets and blades pass through them, they can\'t be grabbed, they never ragdoll. They hide, run to a parent, and remember what they saw. Hurt and Begging show them scared instead.'); card.append(w);
    const w2=el('p','word'); w2.append(el('b',null,'The word. '),'What you do in a house gets out, and the next house has heard it. Spare people and the next family freezes or hides instead of calling 911, and crew members give up or point you to the target. Kill civilians, or a parent in front of a kid, and the next house calls the police sooner, crews fight to the end, and Ray stops being the cop they set up and becomes the cop killer.'); card.append(w2);
  } }
function updateClock(){ clockEl.innerHTML=''; if(state.view==='cast'){ clockEl.append(el('b',null,'Line-up'),SHORT[state.castHouse]); return; } const H=curHouse; clockEl.append(el('b',null,TIMES[H.key]),`House ${H.num} · ${H.who}`); }

window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
document.querySelectorAll('.tabs a[data-view]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const v=a.dataset.view; try{ history.replaceState(null,'','#'+v); }catch(_){} setView(v); }));
const $=id=>document.getElementById(id);
function syncLook(){ state.ps1=$('ps1').checked; state.snap=$('snap').checked; state.affine=$('affine').checked; state.dither=$('dither').checked; $('ps1opts').classList.toggle('dim',!state.ps1); texFilter=state.ps1?gl.NEAREST:gl.LINEAR;
  state.roof=$('roof').checked; state.people=$('people').checked; if(curHouse){ curHouse.roof.vis=state.roof; for(const C of curHouse.chars) C.node.vis=state.people; } }
document.querySelectorAll('.look input').forEach(i=>i.addEventListener('change',syncLook));
document.querySelectorAll('#resSeg button').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('#resSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); state.res=+b.dataset.v; }));
syncLook();

/* ---------- loop ---------- */
function resize(){ const wide=innerWidth>760; viewShift[0]=wide?Math.min(.3,260/innerWidth*1.1):0; viewShift[1]=wide?.04:-.36;
  const dpr=Math.min(devicePixelRatio||1,2); const w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
let last=performance.now(),clock=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  const k=1-Math.exp(-dt*6); for(let i=0;i<3;i++) cam.t[i]+=(goal.t[i]-cam.t[i])*k; cam.th+=(goal.th-cam.th)*k; cam.ph+=(goal.ph-cam.ph)*k; cam.r+=(goal.r-cam.r)*k;
  if(state.view==='houses'&&curHouse&&state.people) for(const C of curHouse.chars){ animateChar(C,clock); skinUpdate(C); }
  if(state.view==='cast'){ const Lu=LINEUPS[state.castHouse]; if(Lu) for(const C of Lu.chars){ animateChar(C,clock); skinUpdate(C); } }
  flickerTick(clock);
  resize();
  const eye=eyePos(), tgt=cam.t;
  if(state.ps1){ const h=state.res,w=Math.max(1,Math.round(h*cv.width/cv.height)); ensureFB(w,h); gl.bindTexture(gl.TEXTURE_2D,null); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); renderScene(world,eye,tgt,w,h,[w,h]);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height); gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); curCull=null;
    gl.useProgram(POST.p); gl.bindVertexArray(emptyVAO); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fbTex);
    gl.uniform1i(POST.loc.tScene,0); gl.uniform2f(POST.loc.uRes,w,h); gl.uniform1f(POST.loc.uDither,state.dither?1:0); gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null); gl.bindTexture(gl.TEXTURE_2D,null); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); renderScene(world,eye,tgt,cv.width,cv.height,[cv.width,cv.height]); }
  requestAnimationFrame(frame); }
const hv=location.hash.slice(1);
setView(hv==='cast'?'cast':'houses',true);
const ld=document.getElementById('loading'); if(ld) ld.hidden=true;
window.__houses={state,setView,showHouse,showLineup,setGoal,cam,goal,HS,LINEUPS,getHouse,ROSTER,renderCard,poseLineup};
requestAnimationFrame(frame);
})();

</script>
