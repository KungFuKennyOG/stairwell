<meta charset="utf-8">
<title>Maiden Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a full-bleed low-res 3D viewport. Title and views top-left, look settings top-right, a working card bottom-left.
   Deliberately one look: a lacquered night-blue railway livery with brass, sakura and signal red. */
:root{
  --bg:#0b0f1a; --panel:rgba(11,15,26,.9); --line:#28304a; --ink:#f1ead8; --ink2:#cfc6b0; --muted:#8e8a7e;
  --brass:#d4ad5a; --sakura:#f2a0b8; --signal:#e0473a; --jade:#3fae9a;
  --display:'Limelight','Didot','Bodoni MT',Georgia,serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated;outline:none}
#view:active{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto;box-sizing:border-box}
.brand{grid-column:1;grid-row:1;align-self:start;justify-self:start;display:grid;gap:10px;min-width:0}
.kick{margin:0;font:600 11px/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);text-shadow:0 0 8px #000}
.kick b{color:var(--brass);font-weight:600}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,78px);line-height:.86;letter-spacing:.01em;text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,.6)}
.brand h1 span{color:var(--sakura)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:10px 14px;border:1px solid var(--line);background:var(--panel)}
.tabs a:hover{border-color:var(--brass)}
.tabs a[aria-current="page"]{background:var(--brass);color:#14100a;border-color:var(--brass)}
.look{grid-column:2;grid-row:1;align-self:start;background:var(--panel);border:1px solid var(--line);width:240px;max-width:100%}
.look summary{cursor:pointer;padding:11px 14px;font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:16px}
.look summary::-webkit-details-marker{display:none}
.look summary::after{content:'+';color:var(--muted)}
.look[open] summary::after{content:'\2013'}
.look-body{display:grid;gap:10px;padding:2px 14px 14px;font-size:13px}
.look label{display:flex;gap:9px;align-items:center;cursor:pointer}
.look input[type=checkbox]{accent-color:var(--brass);width:15px;height:15px;margin:0}
.look .master{font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--line)}
.look .dim{opacity:.4;pointer-events:none}
.seg{display:flex;min-width:0;flex-wrap:wrap}
.seg button{flex:1;font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--line);margin:0 -1px -1px 0;padding:9px 6px;cursor:pointer;white-space:nowrap}
.seg button:hover{border-color:var(--brass)}
.seg button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100a;position:relative}
.seg-label{font:600 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.card{grid-column:1;grid-row:3;align-self:end;justify-self:start;width:min(470px,100%);background:var(--panel);border:1px solid var(--line);padding:16px 18px 12px;display:grid;gap:12px;max-height:56vh;overflow:auto}
.card .sub{margin:0;font:600 10.5px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:.95;letter-spacing:.01em;text-wrap:balance}
.card .body{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:62ch}
.card .body b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0;padding:0;list-style:none}
.chips li{display:flex;gap:6px;align-items:center;font:500 11px/1 var(--mono);color:var(--ink2);letter-spacing:.04em}
.chips i{display:inline-block;width:18px;height:18px;border:1px solid rgba(255,255,255,.18)}
.card ul.list{list-style:none;margin:0;padding:0;display:grid}
.list li button{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:13.5px;padding:9px 2px;cursor:pointer}
.list li button:hover b,.list li button[aria-pressed="true"] b{color:var(--brass)}
.list li .num{font:600 11px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list li button[aria-pressed="true"] .num{color:var(--brass)}
.list li .who{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.list li b{font-weight:700}
.list li small{display:none;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
.list li button[aria-pressed="true"] small{display:block}
.list li .sw{display:flex;gap:2px;align-self:center}
.list li .sw i{display:block;width:7px;height:14px}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row>*{min-width:0}
.btn{font:600 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#14100a;background:var(--ink);border:1px solid var(--ink);padding:0 14px;cursor:pointer;min-height:36px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--sakura);border-color:var(--sakura);color:#1a0c12}
.hint{grid-column:2;grid-row:3;align-self:end;justify-self:end;margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-shadow:0 0 6px #000;text-align:right;line-height:1.5}
#clock{grid-column:2;grid-row:2;align-self:start;justify-self:end;text-align:right;font:600 12px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-shadow:0 0 8px #000}
#clock b{display:block;font:400 34px/1 var(--display);letter-spacing:.02em;color:var(--ink)}
a:focus-visible,button:focus-visible,summary:focus-visible,#view:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#err{position:fixed;inset:auto 16px 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--signal);font-size:13px;line-height:1.5}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);background:var(--bg)}
@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .look{grid-column:1;grid-row:2;justify-self:start;width:100%}
  #clock{grid-column:1;grid-row:3}
  .card{grid-row:4;max-height:44vh;width:100%}
  .hint{display:none}
  .brand h1{font-size:42px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<canvas id="view" tabindex="0" aria-label="3D view of the Maiden Run art direction set. Drag to orbit, scroll or pinch to zoom, arrow keys also orbit."></canvas>
<div class="hud">
  <header class="brand">
    <p class="kick">Art direction set 01 &middot; <b>Republic of Halcyra</b></p>
    <h1>Maiden <span>Run</span></h1>
    <nav class="tabs" aria-label="Views">
      <a href="#route" data-view="route">The line</a>
      <a href="#wagons" data-view="wagons">Wagons</a>
      <a href="#cast" data-view="cast">Cast</a>
    </nav>
  </header>
  <details class="look" id="look">
    <summary>Look</summary>
    <div class="look-body">
      <label class="master"><input type="checkbox" id="ps1" checked> PS1 effects</label>
      <div id="ps1opts" style="display:grid;gap:10px">
        <div>
          <p class="seg-label">Render height</p>
          <div class="seg" id="resSeg">
            <button type="button" data-v="240" aria-pressed="false">240</button>
            <button type="button" data-v="360" aria-pressed="false">360</button>
            <button type="button" data-v="480" aria-pressed="true">480</button>
          </div>
        </div>
        <label><input type="checkbox" id="snap" checked> Vertex wobble</label>
        <label><input type="checkbox" id="affine" checked> Warped textures</label>
        <label><input type="checkbox" id="dither" checked> 15-bit color, dithered</label>
      </div>
      <div>
        <p class="seg-label">Train speed</p>
        <div class="seg" id="speedSeg">
          <button type="button" data-v="0" aria-pressed="false">Stop</button>
          <button type="button" data-v="24" aria-pressed="true">Cruise</button>
          <button type="button" data-v="60" aria-pressed="false">Full</button>
        </div>
      </div>
    </div>
  </details>
  <p id="clock" aria-live="polite"></p>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="hint">Drag to orbit &middot; scroll or pinch to zoom<br>Right-drag or two fingers to pan</p>
</div>
<p id="err" hidden></p>
<p id="loading">Painting the line&hellip;</p>
<script>
'use strict';
(function(){
const cv=document.getElementById('view');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
const errBox=document.getElementById('err');
function fail(msg){ errBox.textContent=msg; errBox.hidden=false; }
if(!gl){ fail('This page needs WebGL2, which this browser has turned off. Try the Quest browser, or Chrome, Firefox or Safari.'); return; }

/* ================= math ================= */
const m4={
  make(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
  mul(o,a,b){ for(let c=0;c<4;c++){ const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3; o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3; o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3; } return o; },
  persp(o,fovy,aspect,near,far){ const f=1/Math.tan(fovy/2); o.fill(0); o[0]=f/aspect; o[5]=f; o[10]=(far+near)/(near-far); o[11]=-1; o[14]=2*far*near/(near-far); return o; },
  lookAt(o,e,c,up){
    let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2]; let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx; l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0; o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0; o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]); o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]); o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1; return o; },
  compose(o,p,r,s){
    const a=Math.cos(r[0]),b=Math.sin(r[0]),c=Math.cos(r[1]),d=Math.sin(r[1]),e=Math.cos(r[2]),f=Math.sin(r[2]);
    const ae=a*e,af=a*f,be=b*e,bf=b*f;
    o[0]=c*e*s[0]; o[1]=(af+be*d)*s[0]; o[2]=(bf-ae*d)*s[0]; o[3]=0;
    o[4]=-c*f*s[1]; o[5]=(ae-bf*d)*s[1]; o[6]=(be+af*d)*s[1]; o[7]=0;
    o[8]=d*s[2]; o[9]=-b*c*s[2]; o[10]=a*c*s[2]; o[11]=0;
    o[12]=p[0]; o[13]=p[1]; o[14]=p[2]; o[15]=1; return o; }
};
const norm3=v=>{ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const rng=seed=>()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

/* ================= scene graph ================= */
class Node{ constructor(){ this.p=[0,0,0]; this.r=[0,0,0]; this.s=[1,1,1]; this.kids=[]; this.vis=true; this.local=m4.make(); this.world=m4.make(); this.mesh=null; this.par=null; }
  add(n){ this.kids.push(n); n.par=this; return n; } }
function N(parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=new Node(); n.p=[x,y,z]; n.r=[rx,ry,rz]; if(parent) parent.add(n); return n; }
function mk(geo,mats,parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const n=N(parent,x,y,z,rx,ry,rz); n.mesh={geo,mats:Array.isArray(mats)?mats:[mats],runs:null}; return n; }
function setParent(n,p){ if(n.par===p) return; if(n.par){ const i=n.par.kids.indexOf(n); if(i>=0) n.par.kids.splice(i,1); } p.add(n); }
function updateWorld(n,pw){ if(!n.vis) return; m4.compose(n.local,n.p,n.r,n.s); if(pw) m4.mul(n.world,pw,n.local); else n.world.set(n.local); for(const k of n.kids) updateWorld(k,n.world); }

/* ================= geometry ================= */
let GEO_TEMP=false;
class Geo{ constructor(){ this.P=[]; this.Nm=[]; this.T=[]; this.I=[]; this.groups=[]; this.vao=null; this.bufs=null; this.temp=GEO_TEMP; }
  v(p,n,t){ this.P.push(p[0],p[1],p[2]); this.Nm.push(n[0],n[1],n[2]); this.T.push(t[0],t[1]); return this.P.length/3-1; } }
function shift(g,x,y,z){ for(let i=0;i<g.P.length;i+=3){ g.P[i]+=x; g.P[i+1]+=y; g.P[i+2]+=z; } return g; }
function flatNormals(g){ for(let i=0;i<g.I.length;i+=3){ const a=g.I[i]*3,b=g.I[i+1]*3,c=g.I[i+2]*3,P=g.P;
  const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2];
  const n=norm3([uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx]); for(const k of [a,b,c]){ g.Nm[k]=n[0]; g.Nm[k+1]=n[1]; g.Nm[k+2]=n[2]; } } return g; }
const FACES=[[[1,0,0],[0,0,-1],[0,1,0],'d','h','w'],[[-1,0,0],[0,0,1],[0,1,0],'d','h','w'],[[0,1,0],[1,0,0],[0,0,-1],'w','d','h'],[[0,-1,0],[1,0,0],[0,0,1],'w','d','h'],[[0,0,1],[1,0,0],[0,1,0],'w','h','d'],[[0,0,-1],[-1,0,0],[0,1,0],'w','h','d']];
function box(w,h,d,o={}){
  const g=new Geo(),S={w,h,d};
  FACES.forEach(([n,U,V,ku,kv,ko],fi)=>{ const start=g.I.length,base=g.P.length/3,du=S[ku]/2,dv=S[kv]/2,off=S[ko]/2;
    for(const [a,b] of [[-1,-1],[1,-1],[1,1],[-1,1]]) g.v([0,1,2].map(k=>n[k]*off+U[k]*a*du+V[k]*b*dv),n,[(a+1)/2,(b+1)/2]);
    g.I.push(base,base+1,base+2,base,base+2,base+3); g.groups.push({start,count:6,mi:fi}); });
  if(o.tw!==undefined||o.td!==undefined){ const tw=o.tw??1,td=o.td??1; for(let i=0;i<g.P.length;i+=3) if(g.P[i+1]>0){ g.P[i]*=tw; g.P[i+2]*=td; } flatNormals(g); }
  if(o.pivot==='t') shift(g,0,-h/2,0); else if(o.pivot==='b') shift(g,0,h/2,0);
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]);
  return g;
}
function plane(w,h,sx=1,sy=1){ const g=new Geo();
  for(let j=0;j<=sy;j++) for(let i=0;i<=sx;i++) g.v([(i/sx-.5)*w,(j/sy-.5)*h,0],[0,0,1],[i/sx,j/sy]);
  for(let j=0;j<sy;j++) for(let i=0;i<sx;i++){ const a=j*(sx+1)+i,b=a+1,c=a+sx+2,d=a+sx+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
function cyl(rt,rb,h,seg,o={}){ const g=new Geo(),hh=h/2,slope=(rb-rt)/h;
  for(let j=0;j<=1;j++){ const y=j?hh:-hh,r=j?rt:rb; for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2,sx=Math.sin(a),cz=Math.cos(a); g.v([r*sx,y,r*cz],norm3([sx,slope,cz]),[i/seg,j]); } }
  for(let i=0;i<seg;i++){ const a=i,b=i+1,c=i+seg+2,d=i+seg+1; g.I.push(a,b,c,a,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0});
  if(!o.open){ for(const top of [1,0]){ const start=g.I.length,y=top?hh:-hh,r=top?rt:rb,ny=top?1:-1; const c=g.v([0,y,0],[0,ny,0],[.5,.5]);
    for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; g.v([r*Math.sin(a),y,r*Math.cos(a)],[0,ny,0],[.5+Math.sin(a)/2,.5+Math.cos(a)/2]); }
    for(let i=0;i<seg;i++){ if(top) g.I.push(c,c+1+i,c+2+i); else g.I.push(c,c+2+i,c+1+i); }
    g.groups.push({start,count:g.I.length-start,mi:top?1:2}); } }
  if(o.at) shift(g,o.at[0],o.at[1],o.at[2]); return g; }
function torus(R,r,rs,ts){ const g=new Geo();
  for(let j=0;j<=rs;j++) for(let i=0;i<=ts;i++){ const u=i/ts*Math.PI*2,v=j/rs*Math.PI*2,cx=R*Math.cos(u),cy=R*Math.sin(u);
    const p=[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)]; g.v(p,norm3([p[0]-cx,p[1]-cy,p[2]]),[i/ts,j/rs]); }
  for(let j=1;j<=rs;j++) for(let i=1;i<=ts;i++){ const a=(ts+1)*j+i-1,b=(ts+1)*(j-1)+i-1,c=(ts+1)*(j-1)+i,d=(ts+1)*j+i; g.I.push(a,b,d,b,c,d); }
  g.groups.push({start:0,count:g.I.length,mi:0}); return g; }
/* merge axis-aligned boxes into one single-material geometry (one draw call) */
function mergeBoxes(list){ const g=new Geo();
  for(const it of list){ const b=box(it[3],it[4],it[5]); const base=g.P.length/3;
    for(let i=0;i<b.P.length;i+=3) g.P.push(b.P[i]+it[0],b.P[i+1]+it[1],b.P[i+2]+it[2]);
    for(const v of b.Nm) g.Nm.push(v);
    for(let i=0;i<b.T.length;i+=2){ g.T.push(b.T[i]*(it[6]||1),b.T[i+1]*(it[7]||1)); }
    for(const ix of b.I) g.I.push(ix+base); }
  g.groups=[{start:0,count:g.I.length,mi:0}]; return g; }

/* ================= textures ================= */
function tex(w,h,base,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); if(base){ g.fillStyle=base; g.fillRect(0,0,w,h); } if(fn) fn(g,w,h); return {c,glt:null,f:-1}; }
function R(g,col,x,y,w,h){ g.fillStyle=col; g.fillRect(x,y,w,h); }

/* =====================================================================================================
   MAIDEN RUN · art direction set. Runs on the Stairwell engine (src/10-engine.js): same renderer, same PS1
   pass, same painted-garment and head painters, same skinned character rig. Everything below is new content.
   ===================================================================================================== */
for(const k in groups) groups[k].vis=false;

/* ---------- canvas painting helpers: smooth gradients first, the PS1 pass quantises them ---------- */
function P2(w,h,fn,gr=0,seed=1){ return tex(w,h,null,g=>{ fn(g,w,h); if(gr) grain(g,gr,seed); }); }
function grad(g,x0,y0,x1,y1,stops){ const q=g.createLinearGradient(x0,y0,x1,y1); for(const [t,c] of stops) q.addColorStop(t,c); return q; }
function vfill(g,x,y,w,h,stops){ g.fillStyle=grad(g,0,y,0,y+h,stops); g.fillRect(x,y,w,h); }
function hfill(g,x,y,w,h,stops){ g.fillStyle=grad(g,x,0,x+w,0,stops); g.fillRect(x,y,w,h); }
function radial(g,cx,cy,r,stops){ const q=g.createRadialGradient(cx,cy,0,cx,cy,r); for(const [t,c] of stops) q.addColorStop(t,c); g.fillStyle=q; g.fillRect(cx-r,cy-r,r*2,r*2); }
function ell(g,cx,cy,rx,ry,col){ g.fillStyle=col; g.beginPath(); g.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); g.fill(); }
function poly(g,pts,col){ g.fillStyle=col; g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); g.fill(); }
function rgba(hex,a){ const [r,g_,b]=hexRGB(hex); return `rgba(${r},${g_},${b},${a})`; }
/* periodic noise: the same at x=0 and x=w, so every scenery tile wraps without a seam */
const pn=(x,w,s,f=3,oct=4)=>{ const a=x/w*Math.PI*2; return fbm(Math.cos(a)*f+20,Math.sin(a)*f+20,s,oct); };
function ridgeP(g,w,h,base,amp,f,seed,fill,oct=4){ g.fillStyle=fill; g.beginPath(); g.moveTo(0,h); for(let x=0;x<=w;x++) g.lineTo(x,base-pn(x,w,seed,f,oct)*amp); g.lineTo(w,h); g.closePath(); g.fill(); }
/* pseudo-glyph signage: blocky strokes that read as lettering at PS1 resolution without pretending to be any real script */
function glyphs(g,x,y,n,cell,col,seed,vertical=true){ const r=rng(seed); g.fillStyle=col;
  for(let i=0;i<n;i++){ const cx=vertical?x:x+i*cell, cy=vertical?y+i*cell:y, s=cell-1;
    const k=r()*4|0; if(k===0){ g.fillRect(cx,cy+1,s,1); g.fillRect(cx+(s>>1),cy,1,s); }
    else if(k===1){ g.fillRect(cx,cy,s,1); g.fillRect(cx,cy+s-1,s,1); g.fillRect(cx,cy,1,s); }
    else if(k===2){ g.fillRect(cx+1,cy,1,s); g.fillRect(cx+s-2,cy,1,s); g.fillRect(cx,cy+(s>>1),s,1); }
    else { g.fillRect(cx,cy,s,1); g.fillRect(cx+(s>>1),cy,1,s); g.fillRect(cx,cy+s-1,s,1); } } }
/* soft painted tree canopies */
function canopy(g,x,y,r,cols,seed){ const q=rng(seed); for(let i=0;i<7;i++){ const a=q()*Math.PI*2,d=q()*r*.55; ell(g,x+Math.cos(a)*d,y+Math.sin(a)*d*.7,r*(.45+q()*.25),r*(.38+q()*.2),cols[0]); }
  for(let i=0;i<5;i++){ const a=-Math.PI*.5+(q()-.5)*2,d=q()*r*.45; ell(g,x+Math.cos(a)*d-r*.15,y+Math.sin(a)*d*.6-r*.12,r*(.25+q()*.15),r*(.2+q()*.1),cols[1]); }
  if(cols[2]) for(let i=0;i<4;i++) ell(g,x-r*.3+q()*r*.4,y-r*.35+q()*r*.3,r*.12,r*.09,cols[2]); }
function trunk(g,x,y0,y1,wd,col){ g.fillStyle=col; g.fillRect(Math.round(x-wd/2),y1,Math.max(1,Math.round(wd)),y0-y1); }
function pine(g,x,base,ht,wd,cols){ for(let i=0;i<4;i++){ const t=i/4, y=base-ht*t*.85, ww=wd*(1-t*.75); poly(g,[[x-ww/2,y],[x+ww/2,y],[x,y-ht*.42]],i%2?cols[0]:cols[1]); } g.fillStyle=cols[2]; g.fillRect(x-.5,base-2,1,3); }
function sakuraTree(g,x,base,ht,seed,full=true){ trunk(g,x,base,base-ht*.55,Math.max(1.5,ht*.07),'#4a2e26');
  g.strokeStyle='#4a2e26'; g.lineWidth=1; g.beginPath(); g.moveTo(x,base-ht*.45); g.lineTo(x-ht*.22,base-ht*.75); g.moveTo(x,base-ht*.5); g.lineTo(x+ht*.25,base-ht*.78); g.stroke();
  canopy(g,x,base-ht*.72,ht*.42,['#e98aa6','#ffc4d4','#fff0f4'],seed); if(full) canopy(g,x+ht*.18,base-ht*.62,ht*.26,['#d97896','#f7b0c4'],seed+3); }

/* ---------- sky: a gradient band with soft painted clouds or stars, wrapped round a cylinder ---------- */
function skyTex(stops,o={}){ return P2(128,128,(g,w,h)=>{ vfill(g,0,0,w,h,stops);
  if(o.stars){ const r=rng(77); for(let i=0;i<120;i++){ const y=r()*h*.6; g.fillStyle=`rgba(255,248,230,${.35+r()*.6*(1-y/(h*.6))})`; g.fillRect(r()*w|0,y|0,1,1); } }
  if(o.clouds){ const r=rng(o.seed||5); for(let i=0;i<o.clouds;i++){ const x=r()*w,y=h*(.25+r()*.45),rx=8+r()*16,ry=2+r()*3.5;
      for(const dx of [-w,0,w]){ ell(g,x+dx,y+1.5,rx,ry,rgba(o.cloudShade||'#c8cfe0',.55)); ell(g,x+dx,y,rx*.9,ry*.85,rgba(o.cloudCol||'#ffffff',.85)); ell(g,x+dx-rx*.3,y-ry*.6,rx*.45,ry*.8,rgba(o.cloudCol||'#ffffff',.9)); } } }
  if(o.glow) radial(g,o.glow[0]*w,o.glow[1]*h,o.glow[2]*w,[[0,o.glow[3]],[1,'rgba(0,0,0,0)']]);
},o.night?3:2,9); }

/* ---------- ground and verge (the strip either side of the track that scrolls past) ---------- */
const flatTex=(base,seed,fn)=>P2(64,64,(g,w,h)=>{ R(g,base,0,0,w,h); const r=rng(seed); for(let i=0;i<90;i++) R(g,rgba(r()>.5?'#ffffff':'#000000',.05),r()*w|0,r()*h|0,2+(r()*4|0),1); if(fn) fn(g,w,h,r); },10,seed);
function vergeTex(kind){ return P2(128,64,(g,w,h)=>{ const r=rng(kind.length*7);
  if(kind==='grass'||kind==='meadow'||kind==='rape'){ vfill(g,0,0,w,h,[[0,'#7aa34e'],[1,'#5e8a3c']]); for(let i=0;i<500;i++){ const x=r()*w|0,y=r()*h|0; R(g,r()>.5?'#8cb85a':'#4f7a34',x,y,1,2); }
    if(kind==='rape') for(let y=4;y<h;y+=9) for(let x=0;x<w;x++) if(pn(x,w,y,6)>-.1) R(g,r()>.3?'#f2d23a':'#e2b02a',x,y+(r()*3|0),1,2);
    if(kind==='meadow') for(let i=0;i<120;i++) R(g,['#f0f0f0','#e8c84a','#c87ad0','#e86a5a'][r()*4|0],r()*w|0,r()*h|0,1,1); }
  else if(kind==='city'){ R(g,'#7d7a78',0,0,w,h); for(let x=0;x<w;x+=32){ R(g,'#6c6a69',x,0,1,h); } R(g,'#a4a09a',0,h-6,w,3); for(let x=0;x<w;x+=16) R(g,'#e8e2d2',x,30,8,2); }
  else if(kind==='night'){ R(g,'#1a1822',0,0,w,h); for(let i=0;i<40;i++){ const x=r()*w|0; R(g,['#ff3fa4','#29e0e6','#f5c542'][r()*3|0],x,r()*h|0,1,4+(r()*8|0)); } for(let x=0;x<w;x+=16) R(g,'#3a3644',x,30,8,2); }
  else if(kind==='sand'){ vfill(g,0,0,w,h,[[0,'#e6d2a0'],[1,'#d8be86']]); for(let i=0;i<300;i++) R(g,r()>.5?'#f0e0b8':'#c8aa70',r()*w|0,r()*h|0,1,1); for(let x=0;x<w;x++) if(pn(x,w,3,4)>.2) R(g,'#8aa85a',x,0,1,4+(pn(x,w,4,8)*6|0)); }
  else if(kind==='tunnel'){ R(g,'#232120',0,0,w,h); for(let i=0;i<200;i++) R(g,r()>.5?'#2e2b29':'#1a1817',r()*w|0,r()*h|0,2,1); R(g,'#3a3634',0,h-8,w,2); }
},8,kind.length); }
function sleeperTex(){ return P2(64,32,(g,w,h)=>{ R(g,'#6e6862',0,0,w,h); const r=rng(31); for(let i=0;i<400;i++) R(g,['#7e7870','#5e5852','#8a847a'][r()*3|0],r()*w|0,r()*h|0,1,1);
  for(let x=2;x<w;x+=10){ vfill(g,x,3,6,h-6,[[0,'#8a8680'],[1,'#6a6660']]); R(g,'#4a4642',x,3,6,1); } },6,31); }

/* =====================================================================================================
   THE SIX STRETCHES OF THE LINE. Each side of the track can have its own far, mid and near layer
   (pos = the +z side, neg = the -z side). Layers are 256x96 tiles; far ones are painted with the
   horizon low in the tile, mid and near ones stand on the ground at the tile's bottom edge.
   ===================================================================================================== */
const LW=256, LH=96;
/* --- Port Lumen: the capital at dawn. One skyline borrowed from everywhere --- */
function lumenFar(g,w,h,r,v){ const haze='#f2b49c',base='#6e5f92',hz=h*.86;
  let x=2,i=0; while(x<w-8){ let tw=5+(r()*14|0); if(x+tw>w-2) break; const th=18+(r()*52|0)+(i%5===2?14:0); const c=mix(base,haze,.18+r()*.38),top=hz-th;
    const kind=(i+v*3)%7;
    if(kind===1){ /* needle tower with two spheres */ const cx=x+tw/2; R(g,c,cx-1,top-18,2,th+18); ell(g,cx,top+th*.35,4,4,mix(c,'#ffffff',.12)); ell(g,cx,top+4,3,3,mix(c,'#ffffff',.18)); tw=Math.max(tw,9); }
    else if(kind===3){ /* tiered tower */ for(let k=0;k<6;k++){ const y=top+k*th/6,ww=tw*(.55+k*.08); poly(g,[[x+tw/2-ww/2,y+th/6],[x+tw/2+ww/2,y+th/6],[x+tw/2+ww*.42,y],[x+tw/2-ww*.42,y]],mix(c,'#ffffff',k%2?.02:.1)); } R(g,c,x+tw/2-.5,top-8,1,8); }
    else if(kind===5){ /* apartment slab with its block number */ vfill(g,x,top,tw+4,th,[[0,mix(c,'#ffffff',.12)],[1,c]]); text(g,String(101+((i+v*7)%9)),x+1,top+3,mix(c,'#000000',.3),1); tw+=4; }
    else { vfill(g,x,top,tw,th,[[0,mix(c,'#ffffff',.14)],[1,c]]); if(kind===0){ poly(g,[[x,top],[x+tw,top],[x+tw/2,top-tw*.9]],mix(c,'#ffffff',.1)); } }
    for(let y=top+3;y<hz;y+=3) R(g,rgba('#ffffff',.08),x,y|0,tw,1);
    x+=tw+(r()*3|0); i++; }
  vfill(g,0,h*.55,w,h*.45,[[0,rgba(haze,0)],[.6,rgba(haze,.6)],[1,'#e8a888']]); }
function lumenMid(g,w,h,r,v){ const pal=['#c8786a','#e2cfa6','#6a8aa0','#a8b4b8','#d89a60','#8a6a7a','#efe2cc','#5f7f7a','#b85a4a'];
  let x=1,i=0; const signs=['HOTEL','RAMEN','CAFE','LUMEN','BANK','KARAOKE','SUSHI','PHOTO','24H'];
  while(x<w-10){ let bw=18+(r()*24|0); if(x+bw>w-1) break; const bh=26+(r()*56|0),top=h-bh,c=pal[(r()*pal.length)|0];
    vfill(g,x,top,bw,bh,[[0,mix(c,'#fff4e0',.18)],[1,mix(c,'#000000',.18)]]); hfill(g,x+bw*.7,top,bw*.3,bh,[[0,rgba('#000000',0)],[1,rgba('#000000',.22)]]);
    R(g,mix(c,'#000000',.35),x,top,bw,1);
    for(let y=top+4;y<h-8;y+=5) for(let xx=x+2;xx<x+bw-3;xx+=4){ const lit=r()<.12; R(g,lit?'#ffd890':mix(c,'#1a2030',.55),xx,y,2,3); }
    if(r()<.5){ /* rooftop water tank */ const tx=x+3+(r()*(bw-10)|0); R(g,'#6a4a36',tx,top-7,6,6); poly(g,[[tx-1,top-7],[tx+7,top-7],[tx+3,top-11]],'#5a3c2a'); R(g,'#3a2a1e',tx,top-1,1,1); R(g,'#3a2a1e',tx+5,top-1,1,1); }
    if(r()<.55){ const sx=x+bw-7,sc=['#d8342e','#f2c230','#2ab0b8','#e85aa0'][r()*4|0]; R(g,sc,sx,top+6,6,Math.min(30,bh-14)); glyphs(g,sx+1,top+8,Math.min(6,(bh-18)/5|0),5,'#fff8e8',i*13+v); }
    else if(bw>26){ const s=signs[(i+v*4)%signs.length],tw=textW(s); if(tw<bw-4){ R(g,'#1d2a4a',x+2,top+5,tw+4,9); text(g,s,x+4,top+7,'#ffe6a8',1); } }
    R(g,mix(c,'#2a2a30',.5),x,h-8,bw,8); R(g,'#e8d2a0',x+2,h-7,bw-4,2);
    x+=bw+(r()*3|0); i++; } }
function lumenNear(g,w,h,r,v){ const bt=h-26; for(let x=0;x<w;x+=1) vfill(g,x,bt,1,26,[[0,'#7fa4a8'],[1,'#5a7c80']]);
  R(g,'#c8ccc8',0,bt-2,w,2); for(let x=0;x<w;x+=16) R(g,'#3e5a5e',x,bt,1,26);
  for(const lx of [40,168]){ R(g,'#2a2c33',lx,bt-58,2,58); R(g,'#2a2c33',lx,bt-58,10,2); R(g,'#fff2c8',lx+8,bt-57,4,2); }
  if(v===0){ trunk(g,100,bt,bt-30,3,'#4a3a2a'); canopy(g,100,bt-40,18,['#4f8a3e','#78b05a','#a8d07a'],r()*99|0); }
  else { trunk(g,220,bt,bt-26,3,'#4a3a2a'); canopy(g,220,bt-36,15,['#4f8a3e','#78b05a','#a8d07a'],r()*99|0); } }

/* --- Mirahama coast: summer sea, a gate standing in the water, a whitewashed town on the cliffs --- */
function coastSeaFar(g,w,h,r,v){ const hz=h*.84; vfill(g,0,hz,w,h-hz,[[0,'#8fd0e0'],[.25,'#3a9cc0'],[1,'#1d6a96']]);
  for(let i=0;i<60;i++) R(g,rgba('#ffffff',.5),r()*w|0,(hz+2+r()*(h-hz-2))|0,2+(r()*3|0),1);
  ridgeP(g,w,hz,hz+1,0,1,1,'rgba(0,0,0,0)');
  const isl=(cx,iw,ih,c)=>{ g.fillStyle=c; g.beginPath(); g.moveTo(cx-iw/2,hz+.5); for(let k=0;k<=20;k++){ const t=k/20; g.lineTo(cx-iw/2+iw*t,hz-Math.sin(t*Math.PI)**.7*ih*(1+.15*Math.sin(t*19+cx))); } g.lineTo(cx+iw/2,hz+.5); g.fill(); };
  isl(60+v*30,70,14,'#6f9a9a'); isl(190-v*20,44,9,'#88aeb0');
  if(v===0){ /* the great gate in the water */ const gx=150,gy=hz+6; const red='#d63a2c';
    R(g,red,gx-14,gy-26,3,26); R(g,red,gx+11,gy-26,3,26); R(g,red,gx-16,gy-20,32,2); poly(g,[[gx-21,gy-27],[gx+21,gy-27],[gx+18,gy-24],[gx-18,gy-24]],'#2a2220'); R(g,red,gx-18,gy-24,36,2);
    for(let k=0;k<6;k++) R(g,rgba(red,.5),gx-14+((k*5)%28),gy+1+k,3,1); }
  else { /* lighthouse on the island */ const lx=60+v*30,ly=hz-12; for(let k=0;k<5;k++) R(g,k%2?'#d63a2c':'#f4f0e6',lx-2,ly-14+k*3,4,3); R(g,'#2a2a2a',lx-2,ly-17,4,3); R(g,'#fff2a8',lx-1,ly-16,2,1); }
  for(let i=0;i<3;i++){ const sx=20+r()*(w-40),sy=hz+3+r()*4; poly(g,[[sx,sy],[sx+3,sy],[sx+1.5,sy-5]],'#ffffff'); } }
function coastLandFar(g,w,h,r,v){ const hz=h*.86; ridgeP(g,w,h,hz-14,10,2,61+v,'#7ea6a4'); ridgeP(g,w,h,hz-4,6,4,62+v,'#6e9a70'); R(g,'#6e9a70',0,hz,w,h-hz); vfill(g,0,h*.5,w,h*.5,[[0,rgba('#e8f4f0',0)],[1,rgba('#e8f4f0',.5)]]); }
function coastBeachMid(g,w,h,r,v){ /* low rocks and beach umbrellas: the sea stays visible behind */ vfill(g,0,h-10,w,10,[[0,'#ecd8a8'],[1,'#d8c08a']]);
  for(let i=0;i<5;i++){ const x=20+i*48+(r()*20|0),c=['#e0473a','#f2c230','#2ab0b8','#f2a0b8'][i%4]; R(g,'#5a4a3a',x,h-22,1,13); poly(g,[[x-9,h-20],[x+10,h-20],[x,h-27]],c); R(g,'#ffffff',x-3,h-20,2,1); }
  for(let i=0;i<4;i++){ const x=r()*w,rw=10+r()*16; ell(g,x,h-8,rw,6,'#7a6a5e'); ell(g,x-2,h-10,rw*.6,4,'#9a8a7a'); } }
function coastTownMid(g,w,h,r,v){ /* cliff with a whitewashed, orange-roofed town stacked up it */
  g.fillStyle='#b89a72'; g.beginPath(); g.moveTo(0,h); for(let x=0;x<=w;x++) g.lineTo(x,h-30-pn(x,w,71+v,2)*18-Math.sin(x/w*Math.PI)*22); g.lineTo(w,h); g.fill();

/* =====================================================================================================
   SCENERY SYSTEM. The train never moves: the world scrolls past along -x. Every outside surface faces the
   track and is single-sided, so an orbiting camera outside it sees straight through (dollhouse rule).
   Layers: sky cylinder, two ground half-planes, a scrolling verge, then far / mid / near painted strips.
   Real parallax comes from distance; far strips also scroll slower, as if they were kilometres away.
   ===================================================================================================== */
const OUT=N(world);                 /* everything outside the train */
const GROUND_Y=-1.3, RAIL_Y=-1.05;
const scrollers=[];                 /* {n, base, L, k, scene} */
let travel=0;
function planeUV(w,h,flipU){ const g=plane(w,h,1,1); if(flipU) for(let i=0;i<g.T.length;i+=2) g.T[i]=1-g.T[i]; return g; }
function wrapX(v,L){ return ((v+L/2)%L+L)%L-L/2; }
function addScroll(n,base,L,k,scene){ n.p[0]=base; scrollers.push({n,base,L,k,scene}); return n; }

/* shared: rails and sleepers (all scenes), catenary poles (outdoor scenes) */
const TRACK=N(OUT);
(function buildTrack(){
  const mRail=M(null,{color:0x8c9096}), mBase=M(null,{color:0x4a4642});
  for(const z of [-.72,.72]){ mk(box(320,.14,.07),mRail,TRACK,0,RAIL_Y-.07,z); mk(box(320,.06,.14),mBase,TRACK,0,RAIL_Y-.16,z); }
  const sl=M(sleeperTex(),{unlit:true,color:[.85,.85,.85]}), g=planeUV(10,3.4);
  for(let i=0;i<32;i++){ const n=mk(g,sl,TRACK,0,RAIL_Y-.2,0,-Math.PI/2); addScroll(n,(i-16)*10,320,1,'*'); }
})();
const POLES=N(OUT), POLE_ARMS=[];
(function buildPoles(){

/* per-scene content, painted and built the first time the scene is shown */
const SCN={};
function buildScene(key){
  const S=SCENES[key], root=N(OUT), seed=key.length*131;
  const sc={key,root,S,petals:[]};
  /* sky */
  if(!S.tunnel){ const [stops,o]=S.sky(); const sky=mk(cyl(92,92,130,28,{open:true}),M(skyTex(stops,o),{unlit:true,double:true,repeat:[4,1]}),root,0,40,0); sky.mesh.geo.noCull=true; sc.sky=sky;
    sc.cap=mk(plane(200,200),M(null,{unlit:true,color:hexInt(S.top)}),root,0,104,0,Math.PI/2); }
  /* ground, one half-plane per side; water sits a little lower */
  for(const side of ['pos','neg']){ const s=side==='pos'?1:-1, y=(S.groundY&&S.groundY[side])??GROUND_Y-.02;
    const col=S.ground[side], water=y<GROUND_Y-.1;
    const t=water?P2(64,64,(g,w,h)=>{ R(g,col,0,0,w,h); const r=rng(5); for(let i=0;i<70;i++) R(g,rgba('#ffffff',.18+r()*.2),r()*w|0,r()*h|0,3+(r()*5|0),1); },6,5):flatTex(col,seed+s);
    mk(plane(400,200),M(t,{unlit:true,repeat:[60,30]}),root,0,y,s*100,-Math.PI/2); }
  /* verge: the strip from the ballast to the near layer, scrolling at full speed */
  for(const side of ['pos','neg']){ const s=side==='pos'?1:-1, vt=M(vergeTex(S.verge[side]),{unlit:true}), g=planeUV(20,9,s>0);
    for(let i=0;i<14;i++){ const n=mk(g,vt,root,0,GROUND_Y+.01,s*6.4,-Math.PI/2); addScroll(n,(i-7)*20,280,1,key); }
    /* ballast shoulder */
    const bt=M(sleeperTex(),{unlit:true,color:[.7,.7,.7]}), gb=planeUV(10,1.8);
    for(let i=0;i<28;i++){ const n=mk(gb,bt,root,0,GROUND_Y+.02,s*1.95,-Math.PI/2); addScroll(n,(i-14)*10,280,1,key); } }
  if(S.tunnel) buildTunnel(sc);
  else {
    /* far / mid / near strips */
    const spec=[[60,30,80,4,.07],[26,15,40,6,.4],[9.4,7.5,20,12,1]];
    for(const side of ['pos','neg']){ const s=side==='pos'?1:-1;
      spec.forEach(([z,h,tw,count,k],li)=>{
        const painter=S.layers[side][li], mats=[0,1].map(v=>M(P2(LW,LH,(g,w,h_)=>painter(g,w,h_,rng(seed+li*17+v*5+(s>0?100:0)),v),0,1),{unlit:true,cut:true}));
        const g=planeUV(tw,h,s>0), yb=li===0?GROUND_Y-1.2:GROUND_Y;
        for(let i=0;i<count;i++){ const n=mk(g,mats[(i+(s>0?1:0))%2],root,0,yb+h/2,s*z,0,s>0?Math.PI:0,0); addScroll(n,(i-count/2)*tw+(s>0?tw*.37:0),tw*count,k,key); } });
    }
  }
  if(S.petals){ const pm=M(null,{unlit:true,double:true,color:0xffc8d8}), pg=plane(.07,.05), r=rng(41);
    for(let i=0;i<70;i++){ const n=mk(pg,pm,root,0,GROUND_Y+.5+r()*6,(r()-.5)*24); sc.petals.push({n,base:(r()-.5)*90,ph:r()*6.28,sp:.7+r()*.5,y0:n.p[1]}); } }
  root.vis=false; SCN[key]=sc; return sc;
}
function buildTunnel(sc){
  const root=sc.root, wall=P2(64,64,(g,w,h)=>{ vfill(g,0,0,w,h,[[0,'#2a2724'],[1,'#3a3532']]); const r=rng(9); for(let i=0;i<300;i++) R(g,r()>.5?'#45403b':'#1e1c1a',r()*w|0,r()*h|0,2,1); R(g,'#151312',0,0,1,h); R(g,'#4a453f',0,h-10,w,2); },8,9);
  const mw=M(wall,{repeat:[2,3]}), lamp=M(null,{unlit:true,color:0xffb050}), cable=M(null,{color:0x111111});
  /* a tunnel bore: a long open cylinder lying along x, faces inward */
  const bore=lathe([[-4.4,4.4,4.4],[4.4,4.4,4.4]],16,{capB:false,capT:false}); for(let i=0;i<bore.I.length;i+=3){ const t=bore.I[i+1]; bore.I[i+1]=bore.I[i+2]; bore.I[i+2]=t; } smoothNormals(bore); /* faces inward: from outside you see straight in */
  for(let i=0;i<10;i++){ const seg=N(root,0,0,0); addScroll(seg,(i-5)*30,300,1,sc.key);
    const b=mk(bore,mw,seg,0,GROUND_Y+3.2,0,0,0,Math.PI/2); b.s=[1,3.42,1]; b.mesh.mats[0]=M(wall,{repeat:[6,2],unlit:true,color:[.62,.56,.5]});
    for(const s of [-1,1]){ mk(box(.5,.12,.08),lamp,seg,-6,GROUND_Y+3.4,s*4.1); mk(box(.5,.12,.08),lamp,seg,9,GROUND_Y+3.4,s*4.1); mk(box(30,.05,.05),cable,seg,0,GROUND_Y+2.6,s*4.15); } }
}
let curScene=null;
function setScene(key){ const sc=SCN[key]||buildScene(key); if(curScene) curScene.root.vis=false; sc.root.vis=true; curScene=sc; POLES.vis=!sc.S.tunnel; return sc; }
function updateOut(dt,speed,camX){
  travel+=dt*speed;
  for(const s of scrollers){ if(s.scene!=='*'&&s.scene!=='poles'&&(!curScene||s.scene!==curScene.key)) continue; s.n.p[0]=wrapX(s.base-travel*s.k,s.L); }
  if(curScene){ if(curScene.sky){ curScene.sky.p[0]=camX; curScene.cap.p[0]=camX; }
    const t=performance.now()/1000; for(const p of curScene.petals){ p.n.p[0]=camX+wrapX(p.base-travel*.9+Math.sin(t*p.sp+p.ph)*.6-camX,90); p.n.p[1]=p.y0+Math.sin(t*1.3*p.sp+p.ph)*.4; p.n.r=[t*2.1*p.sp+p.ph,t*1.7+p.ph,t*.9]; } }
}

const vOf=y=>Math.min(.995,Math.max(.005,(y-PY0)/(PY1-PY0)));
const vRow=(y,H)=>(1-vOf(y))*H;
function loftHalf(g,secs,side,flipU,mi){ const base=g.P.length/3,start=g.I.length,n=PROF.length;
  for(const sc of secs) for(const [z,y] of PROF){ const Y=YC+(y-YC)*sc.sy+sc.dy; g.v([sc.x,Y,side*z*sc.sz],[0,0,side],[flipU?1-sc.u:sc.u,vOf(y)]); }

  g.groups.push({start,count:g.I.length-start,mi}); }
function loft(secs){ const g=new Geo(); loftHalf(g,secs,1,false,0); loftHalf(g,secs,-1,true,0); smoothNormals(g); return g; }

/* livery: 256 x 64, u along the car, v up the side (bottom row = the underside, top row = the roof) */

  for(const u of [.035,.965]){ const x=u*w; R(g,'#bdb4a0',x-5,row(2.2)|0,1,(row(.25)-row(2.2))|0); R(g,'#bdb4a0',x+5,row(2.2)|0,1,(row(.25)-row(2.2))|0); R(g,'#2a3e5a',x-3,row(1.9)|0,6,6); }

const LIVERY={}, GLOWM={};

    extra:(J,o)=>{ crown(J,[[.14,.13,.15],[.17,.09,.11],[.25,.085,.105],[.27,0,0]],M(flat(16,16,476,'#d8c8a0','cotton'))); },fight:HANDS_UP,passenger:true},
  grandma:{name:'Ines Haverkamp',role:'Passenger · retired',where:'Standard Class, seat 3A',color:'#9c8cc4',note:'Eighty-one, unimpressed, knitting. She rode the first steam train on this route as a girl and she is not getting off early.',
    o:Object.assign({jacket:.012,pants:.014,belly:1.05},FEM,{hf:.9}),torso:tGranTorso,arm:tGranArm,leg:tGranLeg,foot:tBrownShoe,
    extra:(J,o)=>{ collar(J,o,M(flat(64,16,496,'#f2ead8','cotton'),{double:true}),.03,.006); bun(J,'#e8e4de'); },fight:HANDS_UP,passenger:true}
};
const CAST_ORDER=['teo','porter','velvet','chef','sisterA','sisterB','boss','conductor','salary','tourist','grandma'];
function makeTrainChar(id,parent,grp){
  const R_=ROSTER[id], k=R_.key||id;
  const o=Object.assign(baseMats(k),R_.o,{torsoM:M(R_.torso),armM:M(R_.arm),legM:M(R_.leg),footM:M(R_.foot)});
  if(R_.hand) o.handM=M(R_.hand);
  const J=rig(o,parent); if(R_.extra) R_.extra(J,o);
  const s={kind:k,faces:FACE[k],grp,fight:R_.fight,showDrop:false};
  if(R_.prop){ Object.assign(s,{prop:R_.prop,gripHand:R_.gripHand,wFight:R_.wFight,twoHand:R_.twoHand,gun:R_.gun}); if(R_.two) s.fightHipsY=J.hips.p[1]-.055; }
  const Cc=finish(parent,J,o,s); Cc.id=id; return Cc; }

/* the line-up on the platform */
const CAST_X=CAST_ORDER.map((_,i)=>(i-(CAST_ORDER.length-1)/2)*1.32);
const castChars=CAST_ORDER.map((id,i)=>{ const slot=N(STATION,CAST_X[i],0,.55,0,0,0); return makeTrainChar(id,slot,'cast'); });
/* and in the wagons */
const wagonChars=[];
for(const key in WG){ const sp=WG[key].spots; for(const name in sp){ const s=sp[name], id=name==='salary'?'salary':name;
  if(!ROSTER[id]) continue; const slot=N(WG[key].g,s.x,s.y||0,s.z,0,s.ry,0); const Cc=makeTrainChar(id,slot,'w:'+key); applyPose(Cc,s.pose); Cc.basePose=s.pose; wagonChars.push(Cc); } }


/* =====================================================================================================
   VIEWS, CAMERA, LIGHT, LOOP
   ===================================================================================================== */
const FP={cab:[4.2,1.6,0,0],salon:[-4.1,1.15,-.8,.25],sleeper:[-5.3,1.6,.75,0],bar:[-1.75,1.1,.95,0],dining:[-3.0,1.15,-.9,.15],standard:[-3.0,1.26,.6,.06],garden:[-4.35,.85,-.75,0],baggage:[-4.6,1.5,.4,-.1],observation:[-2.6,1.2,0,Math.PI]};
const state={view:'route',ps1:true,res:480,snap:true,affine:true,dither:true,scene:'valley',wagon:'bar',fp:false,speed:24,castPose:'fight',focusCar:-1};
try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) state.speed=0; }catch(e){}
const cam={t:[0,1,0],th:.7,ph:1.2,r:16},goal={t:[0,1,0],th:.7,ph:1.2,r:16},fpv={yaw:0,pitch:-.04,gy:0,gp:-.04};
function setGoal(c,instant){ goal.t=c.t.slice(); goal.ph=c.ph; goal.r=c.r; let th=c.th; while(th-cam.th>Math.PI) th-=Math.PI*2; while(th-cam.th<-Math.PI) th+=Math.PI*2; goal.th=th; if(instant){ cam.t=goal.t.slice(); cam.th=goal.th; cam.ph=goal.ph; cam.r=goal.r; } }
function effR(){ const asp=cv.width/Math.max(1,cv.height); return cam.r*Math.max(1,.95/asp); }
function eyePos(){ const r=effR(); return [cam.t[0]+r*Math.sin(cam.ph)*Math.sin(cam.th),cam.t[1]+r*Math.cos(cam.ph),cam.t[2]+r*Math.sin(cam.ph)*Math.cos(cam.th)]; }
const LIM={route:[2.5,24],wagons:[1.2,13],cast:[1.2,14]};
const clampGoal=()=>{ goal.ph=Math.min(1.62,Math.max(.12,goal.ph)); const l=LIM[state.view]; goal.r=Math.min(l[1],Math.max(l[0],goal.r)); fpv.gp=Math.max(-1.2,Math.min(1.1,fpv.gp)); };
const ptrs=new Map(); let lastPinch=0,panMode=false;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); panMode=e.button===2||e.shiftKey; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastPinch=Math.hypot(a.x-b.x,a.y-b.y); } });
cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(inFP()){ fpv.gy+=dx*.005; fpv.gp-=dy*.004; clampGoal(); return; }
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastPinch) goal.r*=lastPinch/d; lastPinch=d; pan(dx/2,dy/2); }
  else if(panMode) pan(dx,dy); else { goal.th-=dx*.006; goal.ph-=dy*.005; } clampGoal(); });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) lastPinch=0; };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr); cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ e.preventDefault(); if(inFP()) return; goal.r*=Math.exp(e.deltaY*.0012); clampGoal(); },{passive:false});
cv.addEventListener('keydown',e=>{ const k={ArrowLeft:[.12,0],ArrowRight:[-.12,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key];
  if(k){ e.preventDefault(); if(inFP()){ fpv.gy-=k[0]; fpv.gp-=k[1]; } else { goal.th+=k[0]; goal.ph+=k[1]; } clampGoal(); }
  if(!inFP()){ if(e.key==='+'||e.key==='='){ goal.r*=.9; clampGoal(); } if(e.key==='-'){ goal.r*=1.1; clampGoal(); } } });
function pan(dx,dy){ const s=goal.r*.0016; const rx=Math.cos(cam.th),rz=-Math.sin(cam.th); goal.t[0]-=rx*dx*s; goal.t[2]-=rz*dx*s; goal.t[1]+=dy*s; goal.t[1]=Math.max(-.5,Math.min(5,goal.t[1])); const lim=state.view==='route'?70:7; goal.t[0]=Math.max(-lim,Math.min(lim,goal.t[0])); goal.t[2]=Math.max(-6,Math.min(6,goal.t[2])); }
const inFP=()=>state.view==='wagons'&&state.fp;

/* ---------- light ---------- */
const STATION_LIGHT={amb:[.5,.44,.46],dir:[-.6,.45,.5],dirCol:[.95,.66,.5],pl:[[[-9,4.4,1.3],[1.1,.85,.55],5],[[-3,4.4,1.3],[1.1,.85,.55],5],[[3,4.4,1.3],[1.1,.85,.55],5],[[9,4.4,1.3],[1.1,.85,.55],5],[[0,2.5,7],[.4,.36,.34],9]]};
function applyLight(){ const S=curScene.S, L0=S.light, fog=F3(S.horizon);
  if(state.view==='cast'){ setLights(Object.assign({fog,fogNear:110,fogFar:220},STATION_LIGHT)); return; }
  if(state.view==='wagons'){ const w=WG[state.wagon], k=Math.max(S.lamp,w.minLamp);
    setLights({amb:L0.amb.map(v=>v*w.ambK),dir:L0.dir,dirCol:L0.dirCol.map(v=>v*w.sunK),fog,fogNear:110,fogFar:220,pl:w.lamps.map(([p,c,d])=>[p,c.map(v=>v*k),d])}); return; }
  setLights({amb:L0.amb,dir:L0.dir,dirCol:L0.dirCol,fog,fogNear:110,fogFar:220,pl:[]}); }

/* ---------- views ---------- */
const VIEWS={
  route:{cam:{t:[0,1.2,0],th:.72,ph:1.22,r:17}},
  wagons:{},
  cast:{cam:{t:[-2.4,1.4,.55],th:0,ph:1.43,r:13}}
};
function wagonCam(){ const w=WG[state.wagon]; return Object.assign({},w.cam,{t:w.cam.t.slice()}); }
function setWagon(key,instant){ for(const k in WG) WG[k].g.vis=false; state.wagon=key; WG[key].g.vis=state.view==='wagons'; if(state.view==='wagons'){ setGoal(wagonCam(),instant); const s=FP[key]; fpv.gy=fpv.yaw=s[3]; fpv.gp=fpv.pitch=-.04; applyLight(); } }
function setSceneUI(key){ state.scene=key; setScene(state.view==='cast'?'lumen':key); setGlow(!!(curScene.S.night||curScene.S.tunnel)&&state.view!=='cast'); applyLight(); updateClock(); }
function setView(v,instant){
  if(!VIEWS[v]) v='route'; state.view=v;
  TRAIN.vis=v==='route'; STATION.vis=v==='cast'; for(const k in WG) WG[k].g.vis=(v==='wagons'&&k===state.wagon);
  POLES.vis=v!=='cast'; for(const a of POLE_ARMS) a.vis=v==='route';
  setScene(v==='cast'?'lumen':state.scene); POLES.vis=v!=='cast'&&!curScene.S.tunnel;
  setGlow(!!(curScene.S.night||curScene.S.tunnel)&&v!=='cast');
  if(v==='wagons') setGoal(wagonCam(),instant); else setGoal(VIEWS[v].cam,instant);
  if(v==='wagons'){ const s=FP[state.wagon]; fpv.gy=fpv.yaw=s[3]; fpv.gp=fpv.pitch=-.04; }
  document.querySelectorAll('.tabs a').forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  applyLight(); renderCard(); updateClock(); }

/* ---------- card ---------- */
const card=document.getElementById('card'), clockEl=document.getElementById('clock');
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
function chips(list,names){ const ul=el('ul','chips'); list.forEach((c,i)=>{ const li=el('li'); const i_=el('i'); i_.style.background=c; li.append(i_,names?names[i]:c.toUpperCase()); ul.append(li); }); return ul; }
function segOf(opts,cur,onPick){ const s=el('div','seg'); for(const [v,label] of opts){ const b=el('button',null,label); b.type='button'; b.dataset.v=v; b.setAttribute('aria-pressed',String(v===cur)); b.addEventListener('click',()=>{ s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); onPick(v); }); s.append(b); } return s; }
function listOf(items,cur,onPick){ const ul=el('ul','list');
  items.forEach(it=>{ const li=el('li'),b=el('button'); b.type='button'; b.setAttribute('aria-pressed',String(it.id===cur));
    let lead; if(it.sw){ lead=el('span','sw'); it.sw.slice(0,3).forEach(c=>{ const i=el('i'); i.style.background=c; lead.append(i); }); } else { lead=el('span','num',it.num||''); if(it.color){ lead.textContent=''; lead.style.cssText=`width:10px;height:10px;background:${it.color};align-self:center`; } }
    const txt=el('span'); txt.style.minWidth='0'; txt.append(el('b',null,it.name)); if(it.sub) txt.append(el('span','who',it.sub)); if(it.note) txt.append(el('small',null,it.note));
    b.append(lead,txt,el('span','num',it.right||'')); b.addEventListener('click',()=>{ ul.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onPick(it); });
    li.append(b); ul.append(li); }); return ul; }
const sceneItems=()=>SCENE_ORDER.map(k=>{ const S=SCENES[k]; return {id:k,name:S.name,sub:S.time,note:S.note,sw:S.swatch,right:'KM '+String(S.km).padStart(3,'0')}; });
function renderCard(){ card.innerHTML='';
  if(state.view==='route'){
    card.append(el('p','sub','Line H1 · Port Lumen to Neo-Hanamura · 362 km'),el('h2',null,'The Silver Heron'));
    const b=el('p','body'); b.append('A nine-car bullet train on its first ever run across the Republic of Halcyra. One day, dawn to night, six very different stretches of line. ',el('b',null,'You start at the back and fight forward to the cab'),', one car at a time.'); card.append(b);
    const sc=SCENES[state.scene]; card.append(el('p','seg-label','Stretch of the line'),listOf(sceneItems(),state.scene,it=>{ setSceneUI(it.id); renderCard(); }));
    const cars=WAGONS.map((W,i)=>({id:W.key,num:W.num,name:W.name,sub:W.sub.split(' · ')[0],color:W.color,right:'View'}));
    card.append(el('p','seg-label','The consist, front to back'),listOf(cars,null,it=>{ const i=WAGONS.findIndex(w=>w.key===it.id); setGoal({t:[(4-i)*CAR_PITCH,1.2,0],th:.62,ph:1.25,r:12}); }));
  } else if(state.view==='wagons'){
    const W=WAGONS.find(w=>w.key===state.wagon), idx=WAGONS.indexOf(W);
    card.append(el('p','sub',`Car ${W.num} of 09 · ${W.sub}`),el('h2',null,W.name),el('p','body',W.note),chips(W.sw));
    const row=el('div','row'); const prev=el('button','btn ghost','‹ Car '+(idx>0?WAGONS[idx-1].num:'')), next=el('button','btn ghost','Car '+(idx<8?WAGONS[idx+1].num:'')+' ›'), sit=el('button','btn',state.fp?'Stand up':'Sit inside');
    for(const b of [prev,next,sit]) b.type='button'; sit.setAttribute('aria-pressed',String(state.fp)); prev.disabled=idx===0; next.disabled=idx===8; if(prev.disabled) prev.style.opacity=.35; if(next.disabled) next.style.opacity=.35;
    prev.addEventListener('click',()=>{ if(idx>0){ setWagon(WAGONS[idx-1].key); renderCard(); } }); next.addEventListener('click',()=>{ if(idx<8){ setWagon(WAGONS[idx+1].key); renderCard(); } });
    sit.addEventListener('click',()=>{ state.fp=!state.fp; const s=FP[state.wagon]; fpv.gy=fpv.yaw=s[3]; fpv.gp=fpv.pitch=-.04; renderCard(); });
    row.append(sit,prev,next); card.append(row);
    card.append(el('p','seg-label','Outside the windows'),segOf(SCENE_ORDER.map(k=>[k,SCENES[k].name.split(' ').slice(-1)[0]]),state.scene,v=>setSceneUI(v)));
    card.append(listOf(WAGONS.map(w=>({id:w.key,num:w.num,name:w.name,sub:w.sub.split(' · ')[0],sw:w.sw})),state.wagon,it=>{ setWagon(it.id); renderCard(); }));
  } else {
    card.append(el('p','sub','Platform 1 · Port Lumen Central · 07:22'),el('h2',null,'Who is on board'));
    card.append(el('p','body','Everyone on the line-up runs on the Stairwell rig: the same skinned body, painted faces and expressions, the same two-handed gun holds. Only the clothes, the faces and the hats are new.'));
    const w=el('div'); w.append(el('p','seg-label','Show them'),segOf([['fight','Fighting'],['hurt','Hurt'],['beg','Begging']],state.castPose,p=>{ state.castPose=p; for(const c of castChars) applyPose(c,p); })); card.append(w);
    card.append(listOf(CAST_ORDER.map((id,i)=>({id,name:ROSTER[id].name,sub:ROSTER[id].role,note:ROSTER[id].note+' '+ROSTER[id].where+'.',color:ROSTER[id].color,i})),null,it=>setGoal({t:[CAST_X[it.i],1.15,.55],th:0,ph:1.42,r:2.8})));
  } }
function updateClock(){ const S=SCENES[state.view==='cast'?'lumen':state.scene]; clockEl.innerHTML=''; const b=el('b',null,state.view==='cast'?'07:22':S.time); clockEl.append(b,state.view==='cast'?'Port Lumen Central':`${S.name} · km ${S.km}`); }

window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
document.querySelectorAll('.tabs a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const v=a.dataset.view; try{ history.replaceState(null,'','#'+v); }catch(_){} setView(v); }));
const $=id=>document.getElementById(id);
function syncLook(){ state.ps1=$('ps1').checked; state.snap=$('snap').checked; state.affine=$('affine').checked; state.dither=$('dither').checked; $('ps1opts').classList.toggle('dim',!state.ps1); texFilter=state.ps1?gl.NEAREST:gl.LINEAR; }
document.querySelectorAll('.look input').forEach(i=>i.addEventListener('change',syncLook));
document.querySelectorAll('#resSeg button').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('#resSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); state.res=+b.dataset.v; }));
document.querySelectorAll('#speedSeg button').forEach(b=>{ b.setAttribute('aria-pressed',String(+b.dataset.v===state.speed)); b.addEventListener('click',()=>{ document.querySelectorAll('#speedSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); state.speed=+b.dataset.v; }); });
syncLook();

/* ---------- loop ---------- */
function resize(){ const wide=innerWidth>760; viewShift[0]=wide?Math.min(.3,260/innerWidth*1.1):0; viewShift[1]=wide?.04:.34; if(inFP()){ viewShift[0]=wide?Math.min(.22,200/innerWidth):0; viewShift[1]=wide?0:.2; }
  const dpr=Math.min(devicePixelRatio||1,2); const w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
let last=performance.now(),clock=0,curSpeed=state.speed;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  const k=1-Math.exp(-dt*6); for(let i=0;i<3;i++) cam.t[i]+=(goal.t[i]-cam.t[i])*k; cam.th+=(goal.th-cam.th)*k; cam.ph+=(goal.ph-cam.ph)*k; cam.r+=(goal.r-cam.r)*k;
  fpv.yaw+=(fpv.gy-fpv.yaw)*k; fpv.pitch+=(fpv.gp-fpv.pitch)*k;
  const target=state.view==='cast'?0:state.speed; curSpeed+=(target-curSpeed)*(1-Math.exp(-dt*1.5));
  updateOut(dt,curSpeed,state.view==='route'?cam.t[0]:0);
  for(const C of castChars) if(state.view==='cast'){ animateChar(C,clock); skinUpdate(C); }
  if(state.view==='wagons'){ for(const C of wagonChars) if(C.grp==='w:'+state.wagon){ animateChar(C,clock); skinUpdate(C); } for(const f of WG[state.wagon].anim) f(clock); }
  if(curScene.S.tunnel&&state.view!=='cast'){ const ph=(travel%15)/15, f=Math.pow(Math.max(0,Math.cos(ph*Math.PI*2)),6)*.55; const a=curScene.S.light.amb; const w=state.view==='wagons'?WG[state.wagon].ambK:1; L.amb=[(a[0]+f*1.0)*w,(a[1]+f*.6)*w,(a[2]+f*.22)*w]; }
  resize();
  let eye,tgt;
  if(inFP()){ const s=FP[state.wagon]; eye=[s[0],s[1],s[2]]; const cp=Math.cos(fpv.pitch); tgt=[eye[0]+Math.cos(fpv.yaw)*cp,eye[1]+Math.sin(fpv.pitch),eye[2]-Math.sin(fpv.yaw)*cp]; }
  else { eye=eyePos(); tgt=cam.t; }
  if(state.view==='wagons'){ const sd=WG[state.wagon].side, near=eye[2]>0?'1':'-1', far=near==='1'?'-1':'1'; sd[far].vis=true; sd[near].vis=inFP()||Math.abs(eye[2])<WZ; }
  if(state.ps1){ const h=state.res,w=Math.max(1,Math.round(h*cv.width/cv.height)); ensureFB(w,h); gl.bindTexture(gl.TEXTURE_2D,null); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); renderScene(world,eye,tgt,w,h,[w,h]);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height); gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); curCull=null;
    gl.useProgram(POST.p); gl.bindVertexArray(emptyVAO); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fbTex);
    gl.uniform1i(POST.loc.tScene,0); gl.uniform2f(POST.loc.uRes,w,h); gl.uniform1f(POST.loc.uDither,state.dither?1:0); gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null); gl.bindTexture(gl.TEXTURE_2D,null); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); renderScene(world,eye,tgt,cv.width,cv.height,[cv.width,cv.height]); }
  requestAnimationFrame(frame); }
setScene(state.scene);
setView(location.hash.slice(1)||'route',true);
const ld=document.getElementById('loading'); if(ld) ld.hidden=true;
window.__train={state,setView,setSceneUI,setWagon,cam,goal,setGoal,fpv,SCENES,WG,castChars,wagonChars,renderCard};
requestAnimationFrame(frame);
})();

</script>
